    if (f === "for") return '<div class="hero for"><div class="card"><span class="mono">slop mop for</span><b>' + esc(s.title) + "</b><ul>" + s.points.map(function (p) { return "<li><i>✓</i><span>" + esc(p) + "</span></li>"; }).join("") + '</ul><div class="logos">' + s.nets.map(logo).join("") + "</div></div></div>";
    if (f === "compare") return '<div class="hero compare"><span class="cap mono">at a glance · checked ' + esc(s.checked) + '</span><div class="card"><table><thead><tr><th></th><th>Slop Mop</th><th>' + esc(s.them) + "</th></tr></thead><tbody>" + s.rows.map(function (r) { return "<tr><th>" + esc(r[0]) + "</th><td>" + esc(r[1]) + "</td><td>" + esc(r[2]) + "</td></tr>"; }).join("") + "</tbody></table></div></div>";
    if (f === "guides") return '<div class="hero guides" style="--net:' + NET[s.net].color + '"><div class="card"><span class="top"><img src="../assets/logos/' + NET[s.net].logo + '.svg" alt="">' + esc(NET[s.net].name) + " guide · " + s.minutes + ' min read</span><b class="h">' + esc(s.title) + "</b><ol>" + s.steps.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ol></div></div>";
    if (f === "learn") return '<div class="hero learn"><div class="card"><span class="mono">slop mop · learn</span><b class="h">' + esc(s.title) + "</b><ol>" + s.steps.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ol></div></div>";
    if (f === "calculators") return '<div class="hero calculators"><div class="readout"><span class="mono">slop calculator · example</span><b>' + esc(s.big) + '</b><span class="l2">' + esc(s.bigLabel) + '</span><span class="t">' + esc(s.title) + '</span><div class="keys"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div>';
    return '<div class="hero hub"><span class="mono">slop mop · ' + esc(s.count) + '</span><b>' + esc(s.title) + '</b><div class="chips">' + s.chips.map(function (c) { return "<span>" + esc(c) + "</span>"; }).join("") + "</div></div>";
  }

  function Fig(p) {
    var s = p.s, n = NET[s.net], tells = {};
    TELLS.forEach(function (k, i) { if (s.tells[i] > 0.05) tells[k] = s.tells[i]; });
    var tone = s.verdict === "likely" ? "red" : "yellow";
    var post = h("div", { className: "post" },
      h("div", { className: "chrome" }, h("img", { src: "../assets/logos/" + n.logo + ".svg", alt: "" }), n.name, h("span", { className: "u" }, n.url)),
      h("div", { className: "who" }, h("span", { className: "av", style: { "--av": s.avColor } }, s.initials),
        h("span", null, h("b", null, s.author), h("small", null, s.byline)),
        h("span", { className: "mop" }, h(DS.MopIcon, { state: tone, label: "Is this slop?" }))),
      s.subject ? h("div", { className: "subject" }, s.subject) : null,
      h("div", { className: "text marked", style: { "--flag": tone === "red" ? "var(--red-500)" : "var(--mop-500)", "--wash": tone === "red" ? "var(--red-100)" : "var(--mop-100)" } }, s.text),
      h("div", { className: "acts" }, s.acts.map(function (a) { return h("span", { key: a }, a); })));
    var card = { verdict: s.verdict, score: s.score, mode: s.mode, tells: tells, humanVoice: s.humanVoice, usefulness: s.usefulness, readerResponse: s.net === "email" ? undefined : s.readerResponse, checksToday: { used: s.used, limit: 250 } };
    if (s.net !== "email") card.community = s.community;
    var fine = s.fine ? h("div", { className: "post fine" },
      h("div", { className: "who" }, h("span", { className: "av", style: { "--av": s.fineColor } }, s.fineInitials),
        h("span", null, h("b", null, s.fineAuthor), h("small", null, s.fineByline)),
        h("span", { className: "mop" }, h(DS.MopIcon, { state: "blue", label: "Looks fine" }))),
      h("div", { className: "text" }, s.fine)) : null;
    return h("div", { className: "fig", style: { "--bg": n.bg } },
      h("div", { className: "col" }, post, fine),
      h("div", { className: "why" }, h("div", { className: "why-scale" }, h(DS.WhyCard, Object.assign({ interactive: false, vote: null, onVote: function () {} }, card)))));
  }

  var root = null;
  window.render = function (spec) {
    var el = document.getElementById("frame");
    if (root) { root.unmount(); root = null; }
    el.innerHTML = "";
    if (spec.mode === "fig") { root = ReactDOM.createRoot(el); root.render(h(Fig, { s: spec })); }
    else el.innerHTML = spec.mode === "og" ? og(spec) : hero(spec);
    return new Promise(function (res) { setTimeout(function () { document.fonts.ready.then(function () { requestAnimationFrame(function () { requestAnimationFrame(res); }); }); }, 30); });
  };
})();
</script>
</body>
</html>
