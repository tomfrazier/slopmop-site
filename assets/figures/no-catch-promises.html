L458.8 212"/></g></svg><span class="sm-sr" aria-live="polite" data-announce></span></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Brass weights: the benefits a post promises</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>Iron blocks: the costs it admits to</span><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Locking pin: holds the beam level with nothing to balance it</span></span><span class="iso-caption">Every post here promises the same three benefits. An honest one names its costs as well, and the free beam settles level because the two sides really do balance. A post that admits one cost tips towards the promise, which is the truth showing. A post that admits none has a pin pushed through the pivot before the weights land: the beam stays perfectly level over an empty pan. That level beam is the tell. The balance streams its reading to the lamp, which pulses white while it weighs, then lights the score (blue below 40, yellow from 40, red from 70) and sends it straight to the dial. The pans clear between posts and the dial drops back to zero.</span></figcaption></figure>
