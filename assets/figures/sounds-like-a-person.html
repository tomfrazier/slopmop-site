<header class="sm-head"><div><span class="sm-eyebrow">Slop Mop figure set · C1 of 17 · counter-signals</span><h1>Sounds like a person</h1></div><p>Writing that carries one person's marks, the way a fingertip does. Nobody else's would read quite the same.</p></header>
<figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">C1</span><span class="iso-plate-corner" data-corner="title">Sounds like a person</span><span class="iso-plate-corner" data-corner="hint">Drag across · ← →</span><span class="iso-plate-corner" data-corner="readout" data-readout>waiting for a post</span></div><div class="sm-stage" tabindex="0" role="slider" aria-label="Sounds like a person. Left and right arrow keys set how much of one person is in the next post; Home and End go to unmistakably them and to no one in particular." aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg" viewBox="0 0 600 400" role="img" aria-label="A bench with a biometric station on the right, a fingerprint scanner and an iris scanner, and an adding machine and a printer on the left. The scanners read the post the way they'd read a person. Writing with one person behind it has ridges that end and fork where only theirs do and an iris with crypts of its own; writing with no one behind it reads like a template of even rings. Each scanner's reading goes down its own cable to the adding machine, which types in the fingerprint's number, then adds the iris's; then it presses its big PRINT key, and the printer feeds out blue-bar paper with the total printed large, out of 100: high when it sounds like that person, low when it sounds like no one."><path class="iso-halo" d="M27.9 162.1L28.1 160.7L28.9 159.4L30.3 158.2L32 157.1L192.3 77L194.5 76.1L196.9 75.4L199.6 75L202.3 74.9L205.1 75L207.7 75.4L210.2 76.1L212.3 77L568 254.8L569.7 255.9L571.1 257.1L571.9 258.4L572.1 259.8L572.1 278.2L571.9 279.6L571.1 280.9L569.7 282.1L568 283.2L407.7 363.4L405.5 364.2L403.1 364.9L400.4 365.3L397.7 365.4L394.9 365.3L392.3 364.9L389.8 364.2L387.7 363.4L32 185.5L30.3 184.5L28.9 183.2L28.1 181.9L27.9 180.5Z"/><g class="iso-solid"><path class="iso-fill" d="M190 116.     stage.style.setProperty("--sm-lamp", rgb(col));
    stage.style.setProperty("--sm-bits", rgb(c.map((v, i) => v * (1 - white) + pal[4][i] * white)));
    if (layer) layer.draw({ uCol: col, uLevel: level, uLight: isDark() ? 0 : 1 }, time);
  };
  // The wires: bits stream from the machine to the lamp while it is reading; a single pulse carries the result from
  // the lamp to the dial, and the dial moves only when it arrives.
  const wires = (stage) => {
    const inn = stage.querySelector('[data-cable="in"]'), out = stage.querySelector('[data-cable="out"]');
    const len = out ? out.getTotalLength() : 0;
    let at = -1, done = null;
    return {
      bits(on) { if (inn) { if (on) inn.setAttribute("data-on", ""); else inn.removeAttribute("data-on"); } },
      send(then, score) { at = 0; done = then; if (out && score != null) out.style.stroke = "rgb(" + colourOf(score).map((v) => Math.round(v * 255)).join(",") + ")"; if (!out) { at = -1; then && then(); } },
      busy: () => at >= 0,
      step(dt) {
        if (at < 0) return;
        at += dt / 0.75;
        if (at >= 1) { at = -1; out.removeAttribute("data-on"); const f = done; done = null; if (f) f(); return; }
        const seg = 11;
        out.setAttribute("data-on", "");
        out.style.strokeDasharray = seg + " " + (len + 40);
        out.style.strokeDashoffset = String(-(at * len) + seg * 0.5);
      },
    };
  };
  return { isDark, colourOf, verdictOf, onTheme, mount, drawLamp, wires };
})();

// C1 Sounds like a person: the live part, inlined after the model and the bench runtime.
const P = D.P;
const stage = document.querySelector(".sm-stage");
const svg = stage.querySelector("svg");
const q = (name) => svg.querySelector('[data-part="' + name + '"]');
const printEl = q("print"), scanbarEl = q("scanbar"), fibresEl = q("fibres"), collEl = q("collarette"), cryptsEl = q("crypts"), irisEl = q("iris"), ringEl = q("scanring");
const fpLight = q("fplight"), irisLight = q("irislight"), ready = q("ready"), keyEl = q("printkey"), sheetEl = q("sheet"), printedEl = q("printed"), feedEl = q("feedbars");
const fpWire = svg.querySelector('[data-cable="fp"]'), irisWire = svg.querySelector('[data-cable="iris"]');
const keyEls = {};
svg.querySelectorAll("[data-key]").forEach((el) => { keyEls[el.getAttribute("data-key")] = el; });
const drums = [...svg.querySelectorAll("[data-drum]")];
const readout = document.querySelector("[data-readout]");
const announce = stage.querySelector("[data-announce]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const wires = bench.wires(stage);

const TOUR = [0.08, 0.5, 0.92, 0.5];
let s = TOUR[0], target = s, touring = !still.matches, run_ = 0;
let frame = 0, last = 0, visible = false;
const clamp = (v) => Math.min(1, Math.max(0, v));
const ease = (v) => { const t = clamp(v); return t * t * (3 - 2 * t); };
const f = (v) => v.toFixed(2);
const onOff = (el, on) => { if (!el) return; if (on) el.setAttribute("data-on", ""); else el.removeAttribute("data-on"); };

// one post, end to end: scan the fingerprint, type its number; scan the iris, type its number (the machine adds it);
// a pause, then PRINT. The times depend on how many keys each number takes
const LOAD = 0.6, GAP = 0.35, PAUSE = 0.5;
const post = { s, score: 0, voice: 1, seed: 1, phase: "run", t: 0, fade: 0, sent: false, id: 0, feed: 0, parts: [0, 0], keys: [[], []], at: {} };

function startPost() {
  post.s = s = target; post.score = scoreOf(s); post.voice = voiceOf(s);
  post.seed = 1.7 + run_ * 3.13 + s * 9;
  post.parts = partsOf(post.score);
  post.keys = post.parts.map(keysOf);
  const a = {};
  a.fp0 = LOAD; a.fp1 = a.fp0 + SCAN_FP;
  a.k10 = a.fp1 + GAP; a.k11 = a.k10 + post.keys[0].length * KEY;
  a.ir0 = a.k11 + GAP; a.ir1 = a.ir0 + SCAN_IRIS;
  a.k20 = a.ir1 + GAP; a.k21 = a.k20 + post.keys[1].length * KEY;
  a.pr = a.k21 + PAUSE;
  post.at = a;
  post.phase = "run"; post.t = 0; post.sent = false; post.id += 1; post.feed = 0;
  // the post's marks, read by both scanners
  printEl.setAttribute("d", fingerprintOf(post.voice, post.seed));
  const iris = irisOf(post.voice, post.seed);
  fibresEl.setAttribute("d", iris.fibres);
  collEl.setAttribute("d", iris.collarette);
  cryptsEl.innerHTML = iris.crypts.map(([x, y, r, ang]) => '<ellipse class="sm-crypt" cx="' + f(x) + '" cy="' + f(y) + '" rx="' + f(r) + '" ry="' + f(r * 0.55) + '" transform="rotate(' + f(ang) + " " + f(x) + " " + f(y) + ')"/>').join("");
  printedEl.textContent = String(post.score).padStart(2, "0");
  showDrums(0);
}
function showDrums(n) { const sc = String(n).padStart(4, "0"); drums.forEach((d, i) => { d.textContent = sc[i]; }); }

// what the machine shows at time t: the digits typed so far, then the running total after each "+"
function machineAt(t) {
  const a = post.at, [p1, p2] = post.parts;
  let shown = 0, key = null, down = 0;
  const typing = (t0, keys, before, entry, after) => {
    if (t < t0) return;
    const i = Math.min(keys.length - 1, Math.floor((t - t0) / KEY)), local = (t - t0) / KEY - i;
    if (t < t0 + keys.length * KEY) { key = keys[i]; down = Math.sin(Math.PI * clamp(local / 0.7)); }
    const typed = keys.slice(0, i + (local > 0.35 ? 1 : 0));
    shown = typed.includes("+") ? after : typed.length ? Number(typed.join("")) : before;
    if (t >= t0 + keys.length * KEY) shown = after;
  };
  typing(a.k10, post.keys[0], 0, p1, p1);
  typing(a.k20, post.keys[1], p1, p2, p1 + p2);
  return { shown, key, down };
}

function step(dt) {
  post.t += dt;
  const t = post.t, a = post.at;
  if (post.phase === "run") {
    post.fade = ease(t / LOAD);
    // the last step: PRINT is pressed and one pulse runs to the printer
    if (!post.sent && t >= a.pr + PRESS * 0.5) {
      post.sent = true;
      const id = post.id;
      wires.send(() => { if (id === post.id) { post.phase = "feed"; post.t = 0; } }, null);
    }
  }
  if (post.phase === "feed") {
    post.feed = ease(post.t / FEED);
    if (post.t > FEED) { post.phase = "hold"; post.t = 0; }
  }
  if (post.phase === "hold" && post.t > 2.6) { post.phase = "clear"; post.t = 0; post.id += 1; }
  if (post.phase === "clear") {
    // torn off along the perforation first, then it fades; the scanners clear with it
    post.fade = 1 - ease((post.t - RIP) / 0.8);
    if (post.t > RIP + 1) { if (touring) { run_ += 1; target = TOUR[run_ % TOUR.length]; } startPost(); }
  }
}

function draw(now) {
  const run = post.phase === "run", t = run ? post.t : 99, a = post.at;
  const op = post.fade.toFixed(3);
  printEl.style.opacity = op; irisEl.style.opacity = op;
  // the scan bar sweeps the platen; the iris ring turns while it's read
  const fp = run && t >= a.fp0 && t < a.fp1, ir = run && t >= a.ir0 && t < a.ir1;
  scanbarEl.style.opacity = fp ? "0.75" : "0";
  if (fp) scanbarEl.setAttribute("x", f(D.PLATEN.x + (D.PLATEN.w - 3) * ((t - a.fp0) / SCAN_FP)));
  ringEl.style.opacity = ir ? "1" : "0";
  if (ir) ringEl.setAttribute("transform", "rotate(" + f(((t - a.ir0) / SCAN_IRIS) * 720) + ")");
  onOff(fpLight, fp); onOff(irisLight, ir);
  // the keys: each typed number, one key at a time; the drums follow
  if (run) {
    const m = machineAt(t);
    showDrums(m.shown);
    for (const name in keyEls) { const on = name === m.key; keyEls[name].setAttribute("transform", on ? translateAlong(P, [0, 0, -D.KEYPRESS * m.down]) : ""); if (on && m.down > 0.3) keyEls[name].setAttribute("data-down", ""); else keyEls[name].removeAttribute("data-down"); }
  } else for (const name in keyEls) { keyEls[name].setAttribute("transform", ""); keyEls[name].removeAttribute("data-down"); }
  // PRINT goes down and comes back up, once, at the end
  const press = run && t >= a.pr ? Math.sin(Math.PI * clamp((t - a.pr) / PRESS)) : 0;
  keyEl.setAttribute("transform", translateAlong(P, [0, 0, -D.KEYDROP * press]));
  // the printer: ready light while printing; the blue-bar paper scrolls in from the stack as the sheet feeds out of the top
  onOff(ready, post.phase === "feed" || (post.phase === "hold" && Math.floor(now / 400) % 2 === 0));
  const len = D.SHEET_LEN;
  const feed = post.phase === "feed" || post.phase === "hold" ? post.feed : post.phase === "clear" ? 1 : 0;
  feedEl.setAttribute("transform", "translate(0 " + f(-((len * feed) % 8)) + ")");
  let tf = "translate(0 " + f(-len * feed) + ")";
  if (post.phase === "clear") {
    // the tear: a tug up and a twist about the right-hand corner, then away
    const r = ease(post.t / RIP);
    tf = "translate(" + f(-2 * r) + " " + f(-len - 9 * r) + ") rotate(" + f(-7 * r) + " " + D.SHEET_W + " " + len + ")";
  }
  sheetEl.setAttribute("transform", tf);
  sheetEl.style.opacity = post.phase === "clear" ? (1 - ease((post.t - RIP) / 0.7)).toFixed(3) : "1";
}

function wiresAt() {
  const t = post.t, a = post.at, run = post.phase === "run" && !still.matches;
  // each scanner's cable carries its reading while it scans, until its number is typed
  onOff(fpWire, run && t >= a.fp0 && t < a.k10);
  onOff(irisWire, run && t >= a.ir0 && t < a.k20);
}

function say() {
  const t = post.t, a = post.at, [p1, p2] = post.parts;
  const text = post.phase === "hold" || post.phase === "feed" ? "printed: " + post.score + " out of 100 · " + noteOf(post.score)
    : post.phase === "clear" ? (post.t < RIP ? "tearing it off" : "next post")
    : t < a.fp0 ? "taking the prints…" : t < a.k10 ? "scanning the fingerprint…" : t < a.ir0 ? "fingerprint: " + p1
    : t < a.k20 ? "scanning the iris…" : t < a.pr ? "fingerprint " + p1 + " + iris " + p2 + " = " + post.score : "PRINT";
  if (readout.textContent !== text) readout.textContent = text;
  const v = "Score " + post.score + " out of 100: " + noteOf(post.score) + ".";
  if (stage.getAttribute("aria-valuetext") !== v) { stage.setAttribute("aria-valuenow", String(post.score)); stage.setAttribute("aria-valuetext", v); }
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (!calm) { step(dt); wires.step(dt); }
  draw(now);
  wiresAt();
  say();
  frame = visible && !calm ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
let quiet = 0, said = 0;
// a new choice is the next post: tear this one off now if it's showing
const steer = (next) => {
  touring = false;
  target = Math.min(1, Math.max(0, next));
  if (still.matches) { settleStill(); }
  else if (post.phase !== "clear") { post.phase = "clear"; post.t = post.feed > 0.5 ? 0 : RIP; post.id += 1; }
  clearTimeout(quiet);
  quiet = setTimeout(() => { if (!still.matches) { touring = true; run_ = Math.max(0, TOUR.findIndex((v) => v >= target - 0.01)); } run(); }, 3600);
  clearTimeout(said);
  said = setTimeout(() => { const sc = scoreOf(target); announce.textContent = "Score " + sc + " out of 100, " + noteOf(sc); }, 700);
  run();
};
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
bench.onTheme(() => run());
let dragging = false;
const fromPointer = (event) => { const b = svg.getBoundingClientRect(); steer(((event.clientX - b.left) / b.width - 0.2) / 0.6); };
stage.addEventListener("pointerdown", (event) => { dragging = true; stage.setPointerCapture(event.pointerId); fromPointer(event); });
stage.addEventListener("pointermove", (event) => { if (dragging) fromPointer(event); });
const release = () => { dragging = false; };
stage.addEventListener("pointerup", release);
stage.addEventListener("pointercancel", release);
stage.addEventListener("keydown", (event) => {
  let to = null;
  const step_ = event.shiftKey ? 0.25 : 0.1;
  if (event.key === "ArrowRight" || event.key === "ArrowUp") to = target + step_;
  if (event.key === "ArrowLeft" || event.key === "ArrowDown") to = target - step_;
  if (event.key === "Home") to = 0;
  if (event.key === "End") to = 1;
  if (to === null) return;
  event.preventDefault();
  steer(to);
});
// reduced motion: the prints read, the total on the drums, the score printed
function settleStill() {
  startPost();
  post.fade = 1; post.phase = "hold"; post.feed = 1;
  showDrums(post.score);
  run();
  draw(performance.now()); say();
}
if (still.matches) { target = 0.08; settleStill(); } else startPost();
draw(performance.now());
</script>
</body></html>
