  const smooth01 = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const colourOf = (score) => {
    const y = smooth01(34, 46, score), r = smooth01(64, 76, score);
    return [0, 1, 2].map((i) => (pal[0][i] * (1 - y) + pal[1][i] * y) * (1 - r) + pal[2][i] * r);
  };
  const verdictOf = (score) => score >= D.zones.likely ? "Likely slop" : score >= D.zones.possibly ? "Possibly slop" : "Looks fine";
  const listeners = [];
  const onTheme = (fn) => listeners.push(fn);
  const fire = () => { readPalette(); listeners.forEach((fn) => fn(isDark())); };
  mq.addEventListener("change", fire);
  new MutationObserver(fire).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  let layer = null;
  const mount = (stage) => {
    const canvas = stage.querySelector(".sm-gl");
    layer = canvas ? glLayer({ canvas, fragment: D.lampFragment, view: [D.W, D.H], camera: D.camera, uniforms: ["uCol", "uLevel", "uLight"] }) : null;
    if (layer) stage.setAttribute("data-gl", "");
    return layer;
  };
  // white: 0 shows the score colour, 1 the lamp's idle white (no reading yet)
  const drawLamp = (stage, score, level, time, white = 0) => {
    const c = colourOf(score);
    const col = c.map((v, i) => v * (1 - white) + pal[3][i] * white);
    const rgb = (v) => "rgb(" + v.map((x) => Math.round(x * 255)).join(",") + ")";
    stage.style.setProperty("--sm-lamp", rgb(col));
    stage.style.setProperty("--sm-bits", rgb(c.map((v, i) => v * (1 - white) + pal[4][i] * white)));
    if (layer) layer.draw({ uCol: col, uLevel: level, uLight: isDark() ? 0 : 1 }, time);
  };
  // The wires: bits stream from the machine to the lamp while it is reading; a single pulse carries the result from
  // the lamp to the dial, and the dial moves only when it arrives.
  const wires = (stage) => {
    const inn = stage.querySelector('[data-cable="in"]'), out = stage.querySelector('[data-cable="out"]');
    const len = out ? out.getTotalLength() : 0;
    let at = -1, done = null;
    return {
      bits(on) { if (inn) { if (on) inn.setAttribute("data-on", ""); else inn.removeAttribute("data-on"); } },
      send(then, score) { at = 0; done = then; if (out && score != null) out.style.stroke = "rgb(" + colourOf(score).map((v) => Math.round(v * 255)).join(",") + ")"; if (!out) { at = -1; then && then(); } },
      busy: () => at >= 0,

        const seg = 11;
        out.setAttribute("data-on", "");

  return { isDark, colourOf, verdictOf, onTheme, mount, drawLamp, wires };
})();

// S7 Flowery prose: the live part, inlined after the model and the bench runtime.
const P = D.P;
const stage = document.querySelector(".sm-stage");
const svg = stage.querySelector("svg");
const q = (name) => svg.querySelector('[data-part="' + name + '"]');
const inkEl = q("ink"), gantryEl = q("gantry"), knobEl = q("knob"), needle = q("needle");
const readout = document.querySelector("[data-readout]");
const announce = stage.querySelector("[data-announce]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
bench.mount(stage);
const wires = bench.wires(stage);

const TOUR = [0.08, 0.5, 0.92, 0.5];
let s = 0.08, target = s, touring = !still.matches, run_ = 0;
let level = 0, frame = 0, last = 0, visible = false;
const clamp = (v) => Math.min(1, Math.max(0, v));
const easeIn = (v) => { const t = clamp(v); return t * t * (3 - 2 * t); };
const f = (v) => v.toFixed(2);
const pt = (p) => { const c = iso(p, P); return f(c[0]) + " " + f(c[1]); };
const TRAIN_N = [0, 6, 8]; // loops per route for the arm's turn
const PARK = [17, -48]; // where the head waits, off the route

// one post: its gears, its route, and where the run is
const post = { s, score: 0, gears: 0, route: null, ratio: 1, draw: 1.7, phase: "load", t: 0, u: 0, ink: 1 };
const pen = { x: A[0], y: A[1], lift: 3, knob: 0 };
const reading = { p: 0, shown: 0, sent: false, id: 0 };
const dial = { target: 0, shown: 0, has: false };

function startPost() {
  post.s = s = target; post.score = scoreOf(s); post.gears = gearsOf(s);
  const r = routeOf(post.gears); post.route = r.points; post.ratio = r.ratio; post.draw = drawTimeOf(r.ratio);
  post.phase = "load"; post.t = 0; post.u = 0; post.ink = 1; post.got = false;
  reading.p = 0; reading.sent = false; reading.id += 1;
}
const routePoint = (u) => { const pts = post.route, i = Math.min(pts.length - 1, Math.floor(u * (pts.length - 1))); return pts[i]; };

function step(dt) {
  post.t += dt;
  // the selector turns to the post's gears, the pen drops on A, draws at one speed, and lifts at B
  pen.knob += ((post.gears - 1) * 0.9 - pen.knob) * (1 - Math.exp(-dt / 0.15));
  if (post.phase === "load") {
    pen.lift = 3 * (1 - easeIn((post.t - 0.3) / 0.3));
    post.u = clamp((post.t - 0.6) / post.draw);
    const p = routePoint(post.u); pen.x = p[0]; pen.y = p[1];
    if (post.u >= 1) {
      // at B the pen lifts and the head parks clear of the sheet, so the whole route can be read
      const t = post.t - 0.6 - post.draw;
      pen.lift = 3 * easeIn(t / 0.3);
      const e = easeIn((t - 0.3) / 0.8); pen.x = B[0] + (PARK[0] - B[0]) * e; pen.y = B[1] + (PARK[1] - B[1]) * e;
      if (t > 1.15) { post.phase = post.got ? "hold" : "read"; post.t = 0; }
    }
  }
  // the lamp reads the route as it is drawn and settles as the pen reaches B; the pulse leaves while the head parks
  if (post.phase === "load" || post.phase === "read") {
    reading.p = Math.max(reading.p, clamp((post.u - 0.5) / 0.45));
    if (reading.p >= 1 && !reading.sent) {
      reading.sent = true;
      const result = post.score, id = reading.id;
      wires.send(() => { if (id === reading.id) { dial.target = result; dial.has = true; post.got = true; if (post.phase === "read") { post.phase = "hold"; post.t = 0; } } }, result);
    }
  }
  if (post.phase === "hold" && post.t > 2.2) { post.phase = "clear"; post.t = 0; dial.target = 0; dial.has = false; reading.p = 0; reading.id += 1; post.from = [pen.x, pen.y]; }
  if (post.phase === "clear") {
    // the sheet is wiped and the head runs back to A
    post.ink = 1 - easeIn(post.t / 0.7);
    const e = easeIn((post.t - 0.2) / 1.0);
    pen.x = post.from[0] + (A[0] - post.from[0]) * e; pen.y = post.from[1] + (A[1] - post.from[1]) * e;
    if (post.t > 1.3) { if (touring) { run_ += 1; target = TOUR[run_ % TOUR.length]; } startPost(); }
  }
}

// a box seen from the camera: its top, its front (+y) and its right (+x) faces
function box(x0, x1, y0, y1, z0, z1) {
  const top = [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]].map(pt);
  const fr = [[x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [x0, y1, z0]].map(pt);
  const rt = [[x1, y0, z1], [x1, y1, z1], [x1, y1, z0], [x1, y0, z0]].map(pt);
  const face = (p, cls) => '<path class="' + cls + '" d="M' + p.join("L") + 'Z"/>';
  return face(top, "sm-boxtop") + face(fr, 'iso-shade" data-shade="2') + face(rt, 'iso-shade" data-shade="1')
    + '<path class="iso-line" data-tone="mid" d="M' + top.join("L") + "ZM" + fr.join("L") + "ZM" + rt.join("L") + 'Z"/>';
}
const ringAt = (x, y, r, z, n = 28) => "M" + Array.from({ length: n }, (_, i) => pt([x + Math.cos((i / n) * 2 * Math.PI) * r, y + Math.sin((i / n) * 2 * Math.PI) * r, z])).join("L") + "Z";
function gantrySvg() {
  const { x, y, lift } = pen, rz = D.RAIL_Z, [r0, r1] = D.RAILS;
  const cz0 = 13, cz1 = 29, out = [];
  out.push(box(x - 5, x + 5, r0 - 3, r0 + 3, rz - 1.8, rz + 4));
  out.push(box(x - 2.6, x + 2.6, r0 - 2, y - 6, rz + 4, rz + 8));
  // the pen: a barrel and a cone tip, riding the lift
  const tipZ = PAPER_Z + lift, k = D.K;
  const a = iso([x, y, cz0], P), b = iso([x, y, tipZ + 2.4], P), c = iso([x, y, tipZ], P);
  out.push('<path class="sm-boxtop" d="M' + f(a[0] - 1.2 * k) + " " + f(a[1]) + "L" + f(b[0] - 1.2 * k) + " " + f(b[1]) + "L" + f(c[0]) + " " + f(c[1]) + "L" + f(b[0] + 1.2 * k) + " " + f(b[1]) + "L" + f(a[0] + 1.2 * k) + " " + f(a[1]) + 'Z"/>');
  out.push('<path class="iso-line" data-tone="mid" d="M' + f(a[0] - 1.2 * k) + " " + f(a[1]) + "L" + f(b[0] - 1.2 * k) + " " + f(b[1]) + "L" + f(c[0]) + " " + f(c[1]) + "L" + f(b[0] + 1.2 * k) + " " + f(b[1]) + "L" + f(a[0] + 1.2 * k) + " " + f(a[1]) + '"/>');
  out.push(box(x - 6.5, x + 6.5, y - 6, y + 6, cz0, cz1));
  // the gear head on top: a ring gear, and an arm carrying one planet per engaged gear, turning with the loops
  out.push('<path class="sm-gear" d="' + ringAt(x, y, 5, cz1) + '"/>');
  const th = 2 * Math.PI * TRAIN_N[post.gears] * post.u;
  if (post.gears > 0) {
    const ax = x + Math.cos(th) * 2.6, ay = y + Math.sin(th) * 2.6;
    out.push('<path class="iso-line" data-tone="hi" d="M' + pt([x, y, cz1]) + "L" + pt([ax, ay, cz1]) + '"/>');
    out.push('<path class="sm-planet" d="' + ringAt(ax, ay, 1.9, cz1, 18) + '"/>');
    if (post.gears > 1) { const th2 = th * 4, bx = ax + Math.cos(th2) * 1.4, by = ay + Math.sin(th2) * 1.4; out.push('<path class="sm-planet" d="' + ringAt(bx, by, 0.9, cz1, 12) + '"/>'); }
  }
  const hub = iso([x, y, cz1], P);
  out.push('<circle class="sm-pellet" cx="' + f(hub[0]) + '" cy="' + f(hub[1]) + '" r="' + f(0.6 * k) + '"/>');
  out.push(box(x - 2.6, x + 2.6, y + 6, r1 + 2, rz + 4, rz + 8));
  out.push(box(x - 5, x + 5, r1 - 3, r1 + 3, rz - 1.8, rz + 4));
  return out.join("");
}
function inkPath() {
  const pts = post.route, n = Math.floor(post.u * (pts.length - 1));
  if (n < 1) return "";
  let d = "M" + pt([pts[0][0], pts[0][1], PAPER_Z]);
  for (let i = 2; i <= n; i += 2) d += "L" + pt([pts[i][0], pts[i][1], PAPER_Z]);
  return post.u >= 1 ? d + "L" + pt([B[0], B[1], PAPER_Z]) : d + "L" + pt([pen.x, pen.y, PAPER_Z]);
}

function draw() {
  inkEl.setAttribute("d", inkPath());
  inkEl.style.opacity = post.ink.toFixed(2);
  gantryEl.innerHTML = gantrySvg();
  const [cx, cy] = D.KNOB, a = pen.knob;
  knobEl.setAttribute("d", lineOnTop([cx, cy], [cx + Math.sin(a) * 3.2, cy - Math.cos(a) * 3.2], D.SEL_Z + 3, P));
}

function say() {
  const what = post.gears === 0 ? "mostly straight line" : "route " + post.ratio.toFixed(1) + "× the line";
  const text = dial.has ? what + " · score " + Math.round(dial.target) + " · " + bench.verdictOf(Math.round(dial.target))
    : wires.busy() ? what + " · sending…" : post.phase === "clear" ? "wiping the sheet" : "drawing A to B…";
  if (readout.textContent !== text) readout.textContent = text;
  const v = "Score " + post.score + ", " + bench.verdictOf(post.score) + ". " + (post.gears === 0 ? "A mostly straight line from A to B, as a hand would draw it." : "A route " + post.ratio.toFixed(1) + " times the straight line, through " + (post.gears === 1 ? "loops." : "loops on loops."));
  if (stage.getAttribute("aria-valuetext") !== v) { stage.setAttribute("aria-valuenow", String(post.score)); stage.setAttribute("aria-valuetext", v); }
}
function needleEnds(score) {
  const a = D.dialFrom + D.dialSpan * (score / 100);
  const { x, y, r } = D.DIAL;
  return [[x - Math.sin(a) * 3, y + Math.cos(a) * 3], [x + Math.sin(a) * (r - 4), y - Math.cos(a) * (r - 4)]];
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (!calm) { step(dt); wires.step(dt); }
  reading.shown += (reading.p - reading.shown) * (1 - Math.exp(-dt / 0.18));
  dial.shown += (dial.target - dial.shown) * (1 - Math.exp(-dt / 0.3));
  if (calm) { reading.shown = 1; dial.shown = dial.target; }
  draw();
  needle.setAttribute("d", lineOnTop(...needleEnds(dial.shown), D.dialTop + 0.2, P));
  const r = reading.shown, e = r * r * (3 - 2 * r), white = 1 - e;
  const pulse = 0.5 + 0.5 * Math.sin((now / 1000) * Math.PI * 1.6);
  level = calm ? 1 : Math.min(1, level + dt / 0.9);
  bench.drawLamp(stage, 6 + 88 * post.s, level * (1 - white * (0.55 - 0.45 * pulse)), calm ? 0.8 : now / 1000, white);
  wires.bits(!calm && (post.phase === "load" || post.phase === "read") && !reading.sent);
  say();
  frame = visible && !calm ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
let quiet = 0, said = 0;
// a new choice goes on the plotter as the next post: wipe the sheet now if a route is showing
const steer = (next) => {
  touring = false;
  target = Math.min(1, Math.max(0, next));
  if (still.matches) { settleStill(); }
  else if (post.phase === "hold" || post.phase === "read") { post.phase = "hold"; post.t = 99; }
  clearTimeout(quiet);
  quiet = setTimeout(() => { if (!still.matches) { touring = true; run_ = Math.max(0, TOUR.findIndex((v) => v >= target - 0.01)); } run(); }, 3600);
  clearTimeout(said);
  said = setTimeout(() => { const sc = scoreOf(target); announce.textContent = "Score " + sc + ", " + bench.verdictOf(sc); }, 700);
  run();
};
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
bench.onTheme(() => run());
let dragging = false;
const fromPointer = (event) => { const box_ = svg.getBoundingClientRect(); steer(((event.clientX - box_.left) / box_.width - 0.2) / 0.6); };
stage.addEventListener("pointerdown", (event) => { dragging = true; stage.setPointerCapture(event.pointerId); fromPointer(event); });
stage.addEventListener("pointermove", (event) => { if (dragging) fromPointer(event); });
const release = () => { dragging = false; };
stage.addEventListener("pointerup", release);
stage.addEventListener("pointercancel", release);
stage.addEventListener("keydown", (event) => {
  let to = null;
  const step_ = event.shiftKey ? 0.25 : 0.1;
  if (event.key === "ArrowRight" || event.key === "ArrowUp") to = target + step_;
  if (event.key === "ArrowLeft" || event.key === "ArrowDown") to = target - step_;
  if (event.key === "Home") to = 0;
  if (event.key === "End") to = 1;
  if (to === null) return;
  event.preventDefault();
  steer(to);
});
// reduced motion: one route drawn, the pen lifted at B, read
function settleStill() {
  startPost();
  post.u = 1; pen.x = PARK[0]; pen.y = PARK[1]; pen.lift = 3; pen.knob = (post.gears - 1) * 0.9;
  reading.p = 1; dial.target = post.score; dial.has = true; post.phase = "hold";
  run();
}
if (still.matches) { target = 0.5; settleStill(); } else { startPost(); pen.knob = (post.gears - 1) * 0.9; }
draw();
</script>
