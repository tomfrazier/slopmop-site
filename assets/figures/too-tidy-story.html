  // pins
  for (const [pu, pv] of PINS) {
    if (segs.some((sg) => segDist([pu, pv], sg.a, sg.b).d < 2 * r + PIN_R + 1.2 + 0.8)) continue; // no gap a ball could wedge in
    const du = b.u - pu, dv = b.v - pv, d = Math.hypot(du, dv);
    if (d < r + PIN_R && d > 1e-6) {
      const nu = du / d, nv = dv / d, push = r + PIN_R - d;
      b.u += nu * push; b.v += nv * push;
      const vn = b.vu * nu + b.vv * nv;
      if (vn < 0) { b.vu -= 1.45 * vn * nu; b.vv -= 1.45 * vn * nv; b.vu += (rnd() - 0.5) * 22 + (Math.abs(b.vu) < 4 ? (rnd() < 0.5 ? -9 : 9) : 0); }
    }
  }
  // rails: one-sided walls. A ball keeps to the side of each rail it met it on, and rolls along it
  segs.forEach((sg, i) => {
    const du = sg.b[0] - sg.a[0], dv = sg.b[1] - sg.a[1], len = Math.hypot(du, dv);
    let nu = -dv / len, nv = du / len;
    if (nu * (FUNNEL_MID[0] - sg.a[0]) + nv * (FUNNEL_MID[1] - sg.a[1]) < 0) { nu = -nu; nv = -nv; }
    const t = ((b.u - sg.a[0]) * du + (b.v - sg.a[1]) * dv) / (len * len);
    if (t < -0.05 || t > 1.05) return;
    const dist = (b.u - sg.a[0]) * nu + (b.v - sg.a[1]) * nv, wall = r + 1.2;
    if (b.side[i] === 0) b.side[i] = dist >= 0 ? 1 : -1;
    const want = b.side[i] * wall, short = b.side[i] > 0 ? want - dist : dist - want;
    if (short > 0) {
      const sn = b.side[i];
      b.u += nu * short * sn; b.v += nv * short * sn;
      const vn = (b.vu * nu + b.vv * nv) * sn;
      if (vn < 0) { b.vu -= 1.2 * vn * nu * sn; b.vv -= 1.2 * vn * nv * sn; }
    }
  });
  // the bins: dividers hold the ball in its bin; it comes to rest on the floor or on the balls below
  // a ball belongs to a bin once its centre is below the divider tops (and so below the rails' ends)
  if (b.v > BIN_TOP) {
    if (b.bin < 0) b.bin = binOf(b.u);
    const lo = FIELD.u0 + b.bin * binWidth + r + 0.5, hi = lo + binWidth - 2 * r - 1;
    if (b.u < lo) { b.u = lo; b.vu = Math.abs(b.vu) * 0.3; }
    if (b.u > hi) { b.u = hi; b.vu = -Math.abs(b.vu) * 0.3; }
    const floor = v1 - r - stacks[b.bin] * (2 * r - 0.2);
    if (b.v >= floor) { b.v = floor; b.u = FIELD.u0 + (b.bin + 0.5) * binWidth; b.state = "rest"; stacks[b.bin] += 1; }
  }
}

function step(dt) {
  post.t += dt;
  rails.shown += ((post.phase === "clear" ? 0 : post.reach) - rails.shown) * (1 - Math.exp(-dt / 0.22));
  if (post.phase === "load") {
    const segs = activeRails(), n = 6;
    for (const b of balls) {
      if (b.state === "wait" && post.t >= b.at) { b.state = "fall"; b.u = DROP_U + (rnd() - 0.5) * 2.4; b.v = FIELD.v0 + 3; b.vu = (rnd() - 0.5) * 14; b.vv = 6; }
      if (b.state === "fall") for (let i = 0; i < n; i++) { physics(b, dt / n, segs); if (b.state !== "fall") break; }
      // a ball wedged somewhere for too long is let through to the bin below it
      if (b.state === "fall" && post.t - b.at > 5) { b.bin = binOf(b.u); b.v = FIELD.v1 - BALL_R - stacks[b.bin] * (2 * BALL_R - 0.2); b.u = FIELD.u0 + (b.bin + 0.5) * binWidth; b.state = "rest"; stacks[b.bin] += 1; }
    }
    const landed = balls.filter((b) => b.state === "rest").length;
    reading.p = Math.max(reading.p, landed / BALLS);
    if (landed === BALLS) { post.phase = "read"; post.t = 0; }
  }
  if ((post.phase === "load" || post.phase === "read") && reading.p >= 1 && !reading.sent) {
    reading.sent = true;
    const result = post.score, id = reading.id;
    wires.send(() => { if (id === reading.id) { dial.target = result; dial.has = true; post.phase = "hold"; post.t = 0; } }, result);
  }
  if (post.phase === "hold" && post.t > 2.4) { post.phase = "clear"; post.t = 0; dial.target = 0; dial.has = false; reading.p = 0; reading.id += 1; }
  if (post.phase === "clear") {
    // the bins' floor drops and the balls fall out of sight; the rails sink back into the board
    for (const b of balls) if (b.state === "rest") { b.v += 90 * dt * easeIn(post.t / 0.3); b.a = 1 - easeIn((post.t - 0.15) / 0.5); }
    if (post.t > 1.3) { if (touring) { run_ += 1; target = TOUR[run_ % TOUR.length]; } startPost(); }
  }
}

function draw() {
  let html = "";
  for (const sg of activeRails()) {
    const d = "M" + f(sg.a[0]) + " " + f(sg.a[1]) + "L" + f(sg.b[0]) + " " + f(sg.b[1]);
    const o = clamp(rails.shown * 4).toFixed(2);
    html += '<g style="opacity:' + o + '"><path class="sm-railshadow" transform="translate(.9 1.1)" d="' + d + '"/><path class="sm-rail" d="' + d + '"/><path class="sm-railhi" transform="translate(-.35 -.45)" d="' + d + '"/></g>';
  }
  railsEl.innerHTML = html;
  ballsEl.innerHTML = balls.filter((b) => b.state === "fall" || b.state === "rest").map((b) => {
    const r = BALL_R;
    return '<g style="opacity:' + b.a.toFixed(2) + '"><circle class="sm-ball" cx="' + f(b.u) + '" cy="' + f(b.v) + '" r="' + r + '"/>'
      + '<path class="sm-ballglint" d="M' + f(b.u - r * 0.55) + " " + f(b.v - r * 0.1) + "A" + f(r * 0.6) + " " + f(r * 0.6) + " 0 0 1 " + f(b.u - r * 0.1) + " " + f(b.v - r * 0.58) + '"/></g>';
  }).join("");
}

function say() {
  const landed = balls.filter((b) => b.state === "rest"), cup = landed.filter((b) => b.bin === CENTRE).length;
  const what = cup + " of " + BALLS + " in the lesson";
  const text = dial.has ? what + " · score " + Math.round(dial.target) + " · " + bench.verdictOf(Math.round(dial.target))
    : wires.busy() ? what + " · sending…" : post.phase === "clear" ? "emptying the bins" : "dropping the balls…";
  if (readout.textContent !== text) readout.textContent = text;
  const v = "Score " + post.score + ", " + bench.verdictOf(post.score) + ". " + (post.reach === 0 ? "No rails; the balls scatter." : post.reach < 1 ? "Short rails steer most balls into the lesson cup." : "A full funnel steers every ball into the lesson cup.");
  if (stage.getAttribute("aria-valuetext") !== v) { stage.setAttribute("aria-valuenow", String(post.score)); stage.setAttribute("aria-valuetext", v); }
}
function needleEnds(score) {
  const a = D.dialFrom + D.dialSpan * (score / 100);
  const { x, y, r } = D.DIAL;
  return [[x - Math.sin(a) * 3, y + Math.cos(a) * 3], [x + Math.sin(a) * (r - 4), y - Math.cos(a) * (r - 4)]];
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (!calm) { step(dt); wires.step(dt); }
  reading.shown += (reading.p - reading.shown) * (1 - Math.exp(-dt / 0.25));
  dial.shown += (dial.target - dial.shown) * (1 - Math.exp(-dt / 0.3));
  if (calm) { reading.shown = 1; dial.shown = dial.target; }
  draw();
  needle.setAttribute("d", lineOnTop(...needleEnds(dial.shown), D.dialTop + 0.2, P));
  const r = reading.shown, e = r * r * (3 - 2 * r), white = 1 - e;
  const pulse = 0.5 + 0.5 * Math.sin((now / 1000) * Math.PI * 1.6);
  level = calm ? 1 : Math.min(1, level + dt / 0.9);
  bench.drawLamp(stage, 6 + 88 * post.s, level * (1 - white * (0.55 - 0.45 * pulse)), calm ? 0.8 : now / 1000, white);
  wires.bits(!calm && (post.phase === "load" || post.phase === "read") && !reading.sent);
  say();
  frame = visible && !calm ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
let quiet = 0, said = 0;
// a new choice drops as the next post: empty the bins now if a post is showing
const steer = (next) => {
  touring = false;
  target = Math.min(1, Math.max(0, next));
  if (still.matches) { settleStill(); }
  else if (post.phase === "hold" || post.phase === "read") { post.phase = "hold"; post.t = 99; }
  clearTimeout(quiet);
  quiet = setTimeout(() => { if (!still.matches) { touring = true; run_ = Math.max(0, TOUR.findIndex((v) => v >= target - 0.01)); } run(); }, 3600);
  clearTimeout(said);
  said = setTimeout(() => { const sc = scoreOf(target); announce.textContent = "Score " + sc + ", " + bench.verdictOf(sc); }, 700);
  run();
};
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
bench.onTheme(() => run());
let dragging = false;
const fromPointer = (event) => { const b = svg.getBoundingClientRect(); steer(((event.clientX - b.left) / b.width - 0.2) / 0.6); };
stage.addEventListener("pointerdown", (event) => { dragging = true; stage.setPointerCapture(event.pointerId); fromPointer(event); });
stage.addEventListener("pointermove", (event) => { if (dragging) fromPointer(event); });
const release = () => { dragging = false; };
stage.addEventListener("pointerup", release);
stage.addEventListener("pointercancel", release);
stage.addEventListener("keydown", (event) => {
  let to = null;
  const step_ = event.shiftKey ? 0.25 : 0.1;
  if (event.key === "ArrowRight" || event.key === "ArrowUp") to = target + step_;
  if (event.key === "ArrowLeft" || event.key === "ArrowDown") to = target - step_;
  if (event.key === "Home") to = 0;
  if (event.key === "End") to = 1;
  if (to === null) return;
  event.preventDefault();
  steer(to);
});
// reduced motion: run the post's drop to the end at once, then show it still
function settleStill() {
  startPost();
  rails.shown = post.reach;
  for (let i = 0; i < 2000 && balls.some((b) => b.state !== "rest"); i++) {
    post.t += 1 / 60;
    const segs = activeRails();
    for (const b of balls) {
      if (b.state === "wait" && post.t >= b.at) { b.state = "fall"; b.u = DROP_U + (rnd() - 0.5) * 2.4; b.v = FIELD.v0 + 3; b.vu = (rnd() - 0.5) * 14; b.vv = 6; }
      if (b.state === "fall") for (let k = 0; k < 6; k++) { physics(b, 1 / 360, segs); if (b.state !== "fall") break; }
    }
  }
  reading.p = 1; dial.target = post.score; dial.has = true; post.phase = "hold";
  run();
}
if (still.matches) { target = 0.5; settleStill(); } else startPost();
draw();
</script>
</body></html>
