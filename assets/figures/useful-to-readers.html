<script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");

};
function pathOf(points, closed = false) {
    if (!points.length)

}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;

function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {

    if (sorted.length < 3)

    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];

        lower.push(point);

function runsOf(flags, want) {

const scoreOf = (s) => Math.round(94 - 88 * s);

// the list, top to bottom; `sub` rows are indented under their item; `half` 0 is what you can know, 1 what you can do
const LIST = [
  { text: "FACTS", sub: false, half: 0 },
  { text: "a source", sub: true, half: 0 },
  { text: "a date", sub: true, half: 0 },
  { text: "FIGURES", sub: false, half: 0 },
  { text: "a number", sub: true, half: 0 },
  { text: "STEPS", sub: false, half: 1 },
  { text: "in order", sub: true, half: 1 },
  { text: "an example", sub: true, half: 1 },
  { text: "TAKEAWAY", sub: false, half: 1 },
];
// the order boxes earn their ticks as a post gets more useful: the first item and its first sub-item, then the next
// item and its sub-item, and so on; the extra sub-items come last
const EARN = [0, 1, 3, 4, 5, 8, 6, 2, 7];
function ticksOf(score) {
  const n = Math.max(2, Math.min(9, Math.round(2 + (5 * (score - 6)) / 88)));
  const on = LIST.map(() => false);
  EARN.slice(0, n).forEach((i) => { on[i] = true; });
  return on;
}
// the adding machine's tape: each half's share of the score, in proportion to its ticks
function partsOf(score, ticks) {
  const a = ticks.filter((t, i) => t && LIST[i].half === 0).length, b = ticks.filter((t, i) => t && LIST[i].half === 1).length;
  const p1 = a + b ? Math.round((score * a) / (a + b)) : 0;
  return [p1, score - p1];
}
const keysOf = (n) => [...String(n), "+"];
const noteOf = (score) => (score >= 70 ? "full of substance" : score >= 40 ? "some substance" : "next to nothing");


const bench = (() => {
  const root = document.documentElement;
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const isDark = () => root.getAttribute("data-theme") === "dark" || (root.getAttribute("data-theme") !== "light" && mq.matches);
  const hex = (h) => { h = h.trim().replace("#", ""); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16) / 255); };
  let pal = null;
  const readPalette = () => { const cs = getComputedStyle(root); pal = ["blue", "yellow", "red", "white"].map((n) => hex(cs.getPropertyValue("--sm-" + n) || "#888888")); pal.push(hex(cs.getPropertyValue("--a-lit") || "#888888")); };
  readPalette();
  const smooth01 = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const colourOf = (score) => {
    const y = smooth01(34, 46, score), r = smooth01(64, 76, score);
    return [0, 1, 2].map((i) => (pal[0][i] * (1 - y) + pal[1][i] * y) * (1 - r) + pal[2][i] * r);
  };
  const verdictOf = (score) => score >= D.zones.likely ? "Likely slop" : score >= D.zones.possibly ? "Possibly slop" : "Looks fine";
  const listeners = [];
  const onTheme = (fn) => listeners.push(fn);
  const fire = () => { readPalette(); listeners.forEach((fn) => fn(isDark())); };
  mq.addEventListener("change", fire);
  new MutationObserver(fire).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  let layer = null;
  const mount = (stage) => {
    const canvas = stage.querySelector(".sm-gl");
    layer = canvas ? glLayer({ canvas, fragment: D.lampFragment, view: [D.W, D.H], camera: D.camera, uniforms: ["uCol", "uLevel", "uLight"] }) : null;
    if (layer) stage.setAttribute("data-gl", "");
    return layer;
  };
  // white: 0 shows the score colour, 1 the lamp's idle white (no reading yet)
  const drawLamp = (stage, score, level, time, white = 0) => {
    const c = colourOf(score);
    const col = c.map((v, i) => v * (1 - white) + pal[3][i] * white);
    const rgb = (v) => "rgb(" + v.map((x) => Math.round(x * 255)).join(",") + ")";
    stage.style.setProperty("--sm-lamp", rgb(col));
    stage.style.setProperty("--sm-bits", rgb(c.map((v, i) => v * (1 - white) + pal[4][i] * white)));
    if (layer) layer.draw({ uCol: col, uLevel: level, uLight: isDark() ? 0 : 1 }, time);
  };
  // The wires: bits stream from the machine to the lamp while it is reading; a single pulse carries the result from
  // the lamp to the dial, and the dial moves only when it arrives.
  const wires = (stage) => {
    const inn = stage.querySelector('[data-cable="in"]'), out = stage.querySelector('[data-cable="out"]');
    const len = out ? out.getTotalLength() : 0;
    let at = -1, done = null;
    return {
      bits(on) { if (inn) { if (on) inn.setAttribute("data-on", ""); else inn.removeAttribute("data-on"); } },
      send(then, score) { at = 0; done = then; if (out && score != null) out.style.stroke = "rgb(" + colourOf(score).map((v) => Math.round(v * 255)).join(",") + ")"; if (!out) { at = -1; then && then(); } },
      busy: () => at >= 0,
      step(dt) {
        if (at < 0) return;
        at += dt / 0.75;
        if (at >= 1) { at = -1; out.removeAttribute("data-on"); const f = done; done = null; if (f) f(); return; }
        const seg = 11;
        out.setAttribute("data-on", "");
        out.style.strokeDasharray = seg + " " + (len + 40);
        out.style.strokeDashoffset = String(-(at * len) + seg * 0.5);
      },
    };
  };
  return { isDark, colourOf, verdictOf, onTheme, mount, drawLamp, wires };
})();

// C2 Useful to readers: the live part, inlined after the model and the bench runtime.
const P = D.P;
const stage = document.querySelector(".sm-stage");
const svg = stage.querySelector("svg");
const q = (name) => svg.querySelector('[data-part="' + name + '"]');
const carEl = q("carriage"), headEl = q("head"), penLight = q("penlight");
const ready = q("ready"), keyEl = q("printkey"), sheetEl = q("sheet"), printedEl = q("printed"), feedEl = q("feedbars");
const inWire = svg.querySelector('[data-cable="in"]');
const tickEls = [...svg.querySelectorAll("[data-tick]")], rowEls = [...svg.querySelectorAll("[data-row]")];
const keyEls = {};
svg.querySelectorAll("[data-key]").forEach((el) => { keyEls[el.getAttribute("data-key")] = el; });
const drums = [...svg.querySelectorAll("[data-drum]")];
const readout = document.querySelector("[data-readout]");
const announce = stage.querySelector("[data-announce]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const wires = bench.wires(stage);

const TOUR = [0.08, 0.5, 0.92, 0.5];
let s = TOUR[0], target = s, touring = !still.matches, run_ = 0;
let frame = 0, last = 0, visible = false;
const clamp = (v) => Math.min(1, Math.max(0, v));
const ease = (v) => { const t = clamp(v); return t * t * (3 - 2 * t); };
const f = (v) => v.toFixed(2);
const onOff = (el, on) => { if (!el) return; if (on) el.setAttribute("data-on", ""); else el.removeAttribute("data-on"); };

// one post, end to end: the pen goes down the top half of the list ticking what the post has, the machine types that
// half's share; then the bottom half, added; a pause, then PRINT. The times depend on the keys each number takes
const LOAD = 0.8, GAP = 0.35, PAUSE = 0.5;
const post = { s, score: 0, seed: 1, phase: "run", t: 0, fade: 0, sent: false, id: 0, feed: 0, parts: [0, 0], keys: [[], []], at: {}, ticks: [], stops: [] };
// where the pen is at time t: it moves to each row in turn, then ticks the box (or passes it by)
const spot = (i) => ({ u: D.BOX_U[LIST[i].sub ? 1 : 0], v: D.ROWS[i] });
function penAt(t) {
  const st = post.stops;
  let from = spot(0);
  for (const stop of st) {
    const to = spot(stop.i);
    if (t < stop.t0) return { ...from, ticking: -1 };
    if (t < stop.t1) { const e = ease((t - stop.t0) / (stop.t1 - stop.t0)); return { u: from.u + (to.u - from.u) * e, v: from.v + (to.v - from.v) * e, ticking: -1 }; }
    if (t < stop.t2) return { ...to, ticking: post.ticks[stop.i] ? stop.i : -1, k: (t - stop.t1) / (stop.t2 - stop.t1) };
    from = to;
  }
  return { ...from, ticking: -1 };
}
function startPost() {
  post.s = s = target; post.score = scoreOf(s);
  post.ticks = ticksOf(post.score);
  post.parts = partsOf(post.score, post.ticks);
  post.keys = post.parts.map(keysOf);
  // the pen's stops: each row of a half, a move then a tick (or a pause); the halves run with the typing between them
  const a = {}, stops = [];
  let t = LOAD;
  const half = (h) => { LIST.forEach((row, i) => { if (row.half !== h) return; stops.push({ i, t0: t, t1: t + MOVE, t2: t + MOVE + TICK }); t += MOVE + TICK; }); };
  a.h10 = t; half(0); a.h11 = t;
  a.k10 = a.h11 + GAP; a.k11 = a.k10 + post.keys[0].length * KEY;
  t = a.k11 + GAP;
  a.h20 = t; half(1); a.h21 = t;
  a.k20 = a.h21 + GAP; a.k21 = a.k20 + post.keys[1].length * KEY;
  a.pr = a.k21 + PAUSE;
  post.at = a; post.stops = stops;
  post.phase = "run"; post.t = 0; post.sent = false; post.id += 1; post.feed = 0;
  printedEl.textContent = String(post.score).padStart(2, "0");
  showDrums(0);
}
function showDrums(n) { const sc = String(n).padStart(4, "0"); drums.forEach((d, i) => { d.textContent = sc[i]; }); }

// what the machine shows at time t: the digits typed so far, then the running total after each "+"
function machineAt(t) {
  const a = post.at, [p1, p2] = post.parts;
  let shown = 0, key = null, down = 0;
  const typing = (t0, keys, before, entry, after) => {
    if (t < t0) return;
    const i = Math.min(keys.length - 1, Math.floor((t - t0) / KEY)), local = (t - t0) / KEY - i;
    if (t < t0 + keys.length * KEY) { key = keys[i]; down = Math.sin(Math.PI * clamp(local / 0.7)); }
    const typed = keys.slice(0, i + (local > 0.35 ? 1 : 0));
    shown = typed.includes("+") ? after : typed.length ? Number(typed.join("")) : before;
    if (t >= t0 + keys.length * KEY) shown = after;
  };
  typing(a.k10, post.keys[0], 0, p1, p1);
  typing(a.k20, post.keys[1], p1, p2, p1 + p2);
  return { shown, key, down };
}

function step(dt) {
  post.t += dt;
  const t = post.t, a = post.at;
  if (post.phase === "run") {
    post.fade = ease(t / LOAD);
    // the last step: PRINT is pressed and one pulse runs to the printer
    if (!post.sent && t >= a.pr + PRESS * 0.5) {
      post.sent = true;
      const id = post.id;
      wires.send(() => { if (id === post.id) { post.phase = "feed"; post.t = 0; } }, null);
    }
  }
  if (post.phase === "feed") {
    post.feed = ease(post.t / FEED);
    if (post.t > FEED) { post.phase = "hold"; post.t = 0; }
  }
  if (post.phase === "hold" && post.t > 2.6) { post.phase = "clear"; post.t = 0; post.id += 1; }
  if (post.phase === "clear") {
    // torn off along the perforation first, then it fades; the scanners clear with it
    post.fade = 1 - ease((post.t - RIP) / 0.8);
    if (post.t > RIP + 1) { if (touring) { run_ += 1; target = TOUR[run_ % TOUR.length]; } startPost(); }
  }
}

function draw(now) {
  const run = post.phase === "run", t = run ? post.t : 99, a = post.at;
  // the pen: where it is, the ticks it has drawn, the rows it passed by greyed out
  const pen = run ? penAt(t) : post.phase === "clear" ? { u: D.TIP0.u, v: D.TIP0.v, ticking: -1 } : penAt(1e9);
  post.stops.forEach((stop) => {
    const i = stop.i, el = tickEls[i];
    const k = !post.ticks[i] ? 0 : run ? clamp((t - stop.t1) / (stop.t2 - stop.t1)) : 1;
    el.style.strokeDashoffset = (1 - k).toFixed(3);
    el.style.opacity = post.phase === "clear" ? (1 - ease(post.t / 0.6)).toFixed(3) : "1";
    const missed = !post.ticks[i] && (!run || t >= stop.t2) && post.phase !== "clear";
    if (missed) rowEls[i].setAttribute("data-miss", ""); else rowEls[i].removeAttribute("data-miss");
  });
  if (post.phase === "clear") { const e = ease(post.t / 1.2), last = penAt(1e9); pen.u = last.u + (D.TIP0.u - last.u) * e; pen.v = last.v + (D.TIP0.v - last.v) * e; }
  carEl.setAttribute("transform", translateAlong(P, [0, 0, -(pen.v - D.TIP0.v)]));
  headEl.setAttribute("transform", translateAlong(P, [pen.u - D.TIP0.u, 0, 0]));
  onOff(penLight, pen.ticking >= 0);
  // the keys: each typed number, one key at a time; the drums follow
  if (run) {
    const m = machineAt(t);
    showDrums(m.shown);
    for (const name in keyEls) { const on = name === m.key; keyEls[name].setAttribute("transform", on ? translateAlong(P, [0, 0, -D.KEYPRESS * m.down]) : ""); if (on && m.down > 0.3) keyEls[name].setAttribute("data-down", ""); else keyEls[name].removeAttribute("data-down"); }
  } else for (const name in keyEls) { keyEls[name].setAttribute("transform", ""); keyEls[name].removeAttribute("data-down"); }
  // PRINT goes down and comes back up, once, at the end
  const press = run && t >= a.pr ? Math.sin(Math.PI * clamp((t - a.pr) / PRESS)) : 0;
  keyEl.setAttribute("transform", translateAlong(P, [0, 0, -D.KEYDROP * press]));
  // the printer: ready light while printing; the blue-bar paper scrolls in from the stack as the sheet feeds out of the top
  onOff(ready, post.phase === "feed" || (post.phase === "hold" && Math.floor(now / 400) % 2 === 0));
  const len = D.SHEET_LEN;
  const feed = post.phase === "feed" || post.phase === "hold" ? post.feed : post.phase === "clear" ? 1 : 0;
  feedEl.setAttribute("transform", "translate(0 " + f(-((len * feed) % 8)) + ")");
  let tf = "translate(0 " + f(-len * feed) + ")";
  if (post.phase === "clear") {
    // the tear: a tug up and a twist about the right-hand corner, then away
    const r = ease(post.t / RIP);
    tf = "translate(" + f(-2 * r) + " " + f(-len - 9 * r) + ") rotate(" + f(-7 * r) + " " + D.SHEET_W + " " + len + ")";
  }
  sheetEl.setAttribute("transform", tf);
  sheetEl.style.opacity = post.phase === "clear" ? (1 - ease((post.t - RIP) / 0.7)).toFixed(3) : "1";
}

function wiresAt() {
  const t = post.t, a = post.at, run = post.phase === "run" && !still.matches;
  // the clipboard's cable carries each half's ticks while the pen works down it, until its share is typed
  onOff(inWire, run && ((t >= a.h10 && t < a.k10) || (t >= a.h20 && t < a.k20)));
}

function say() {
  const t = post.t, a = post.at, [p1, p2] = post.parts;
  const text = post.phase === "hold" || post.phase === "feed" ? "printed: " + post.score + " out of 100 · " + noteOf(post.score)
    : post.phase === "clear" ? (post.t < RIP ? "tearing it off" : "next post")
    : t < a.h10 ? "clipping on the post…" : t < a.k10 ? "checking facts and figures…" : t < a.h20 ? "facts and figures: " + p1
    : t < a.k20 ? "checking steps and a takeaway…" : t < a.pr ? "facts and figures " + p1 + " + steps and takeaway " + p2 + " = " + post.score : "PRINT";
  if (readout.textContent !== text) readout.textContent = text;
  const v = "Score " + post.score + " out of 100: " + noteOf(post.score) + ".";
  if (stage.getAttribute("aria-valuetext") !== v) { stage.setAttribute("aria-valuenow", String(post.score)); stage.setAttribute("aria-valuetext", v); }
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (!calm) { step(dt); wires.step(dt); }
  draw(now);
  wiresAt();
  say();
  frame = visible && !calm ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
let quiet = 0, said = 0;
// a new choice is the next post: tear this one off now if it's showing
const steer = (next) => {
  touring = false;
  target = Math.min(1, Math.max(0, next));
  if (still.matches) { settleStill(); }
  else if (post.phase !== "clear") { post.phase = "clear"; post.t = post.feed > 0.5 ? 0 : RIP; post.id += 1; }
  clearTimeout(quiet);
  quiet = setTimeout(() => { if (!still.matches) { touring = true; run_ = Math.max(0, TOUR.findIndex((v) => v >= target - 0.01)); } run(); }, 3600);
  clearTimeout(said);
  said = setTimeout(() => { const sc = scoreOf(target); announce.textContent = "Score " + sc + " out of 100, " + noteOf(sc); }, 700);
  run();
};
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
bench.onTheme(() => run());
let dragging = false;
const fromPointer = (event) => { const b = svg.getBoundingClientRect(); steer(((event.clientX - b.left) / b.width - 0.2) / 0.6); };
stage.addEventListener("pointerdown", (event) => { dragging = true; stage.setPointerCapture(event.pointerId); fromPointer(event); });
stage.addEventListener("pointermove", (event) => { if (dragging) fromPointer(event); });
const release = () => { dragging = false; };
stage.addEventListener("pointerup", release);
stage.addEventListener("pointercancel", release);
stage.addEventListener("keydown", (event) => {
  let to = null;
  const step_ = event.shiftKey ? 0.25 : 0.1;
  if (event.key === "ArrowRight" || event.key === "ArrowUp") to = target + step_;
  if (event.key === "ArrowLeft" || event.key === "ArrowDown") to = target - step_;
  if (event.key === "Home") to = 0;
  if (event.key === "End") to = 1;
  if (to === null) return;
  event.preventDefault();
  steer(to);
});
// reduced motion: the list ticked, the total on the drums, the score printed
function settleStill() {
  startPost();
  post.fade = 1; post.phase = "hold"; post.feed = 1;
  showDrums(post.score);
  run();
  draw(performance.now()); say();
}
if (still.matches) { target = 0.08; settleStill(); } else startPost();
draw(performance.now());
</script>
</body></html>
