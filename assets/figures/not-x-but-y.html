"iso-caption">Each post goes up on the board, one line a row. A plain line just says something, and its flaps settle at their own pace. A framed line sets up a straw man first (NOT A TOOL), strikes it out, and flips to the thing it wanted to say all along (A MOVEMENT). One such line is a choice. When every row does it, all on the same tick of the metronome, the rhythm gives it away. The board streams to the lamp, which pulses white while it reads, then lights the score (blue below 40, yellow from 40, red from 70) and sends it straight to the dial. The board clears between posts and the dial drops back to zero.</span></figcaption></figure>

  new MutationObserver(fire).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  let layer = null;
  const mount = (stage) => {
    const canvas = stage.querySelector(".sm-gl");
    layer = canvas ? glLayer({ canvas, fragment: D.lampFragment, view: [D.W, D.H], camera: D.camera, uniforms: ["uCol", "uLevel", "uLight"] }) : null;
    if (layer) stage.setAttribute("data-gl", "");
    return layer;
  };
  // white: 0 shows the score colour, 1 the lamp's idle white (no reading yet)
  const drawLamp = (stage, score, level, time, white = 0) => {
    const c = colourOf(score);
    const col = c.map((v, i) => v * (1 - white) + pal[3][i] * white);
    const rgb = (v) => "rgb(" + v.map((x) => Math.round(x * 255)).join(",") + ")";
    stage.style.setProperty("--sm-lamp", rgb(col));
    stage.style.setProperty("--sm-bits", rgb(c.map((v, i) => v * (1 - white) + pal[4][i] * white)));
    if (layer) layer.draw({ uCol: col, uLevel: level, uLight: isDark() ? 0 : 1 }, time);
  };
  // The wires: bits stream from the machine to the lamp while it is reading; a single pulse carries the result from
  // the lamp to the dial, and the dial moves only when it arrives.
  const wires = (stage) => {
    const inn = stage.querySelector('[data-cable="in"]'), out = stage.querySelector('[data-cable="out"]');
    const len = out ? out.getTotalLength() : 0;
    let at = -1, done = null;
    return {
      bits(on) { if (inn) { if (on) inn.setAttribute("data-on", ""); else inn.removeAttribute("data-on"); } },
      send(then, score) { at = 0; done = then; if (out && score != null) out.style.stroke = "rgb(" + colourOf(score).map((v) => Math.round(v * 255)).join(",") + ")"; if (!out) { at = -1; then && then(); } },
      busy: () => at >= 0,
      step(dt) {
        if (at < 0) return;
        at += dt / 0.75;
        if (at >= 1) { at = -1; out.removeAttribute("data-on"); const f = done; done = null; if (f) f(); return; }
        const seg = 11;
        out.setAttribute("data-on", "");
        out.style.strokeDasharray = seg + " " + (len + 40);
        out.style.strokeDashoffset = String(-(at * len) + seg * 0.5);
      },
    };
  };
  return { isDark, colourOf, verdictOf, onTheme, mount, drawLamp, wires };
})();

// S6 Not X, but Y: the live part, inlined after the model and the bench runtime.
const P = D.P;
const stage = document.querySelector(".sm-stage");
const svg = stage.querySelector("svg");
const q = (name) => svg.querySelector('[data-part="' + name + '"]');
const cellsEl = q("cells"), strikesEl = q("strikes"), pendEl = q("pendulum"), needle = q("needle");
const readout = document.querySelector("[data-readout]");
const announce = stage.querySelector("[data-announce]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
bench.mount(stage);
const wires = bench.wires(stage);

const TOUR = [0.08, 0.5, 0.92, 0.5];
let s = 0.08, target = s, touring = !still.matches, run_ = 0;
let level = 0, frame = 0, last = 0, visible = false;
const clamp = (v) => Math.min(1, Math.max(0, v));
const easeIn = (v) => { const t = clamp(v); return t * t * (3 - 2 * t); };
const f = (v) => v.toFixed(2);
const FLIP = 0.1, SNAP = 0.13; // seconds per flap; the beat flip is a touch slower so it reads
const GLYPHS = "ABCDEFGHIJKLMNOPRSTUVWY0123456789$/";
// a repeatable random stream per post, so a row's flutter is the same every time it is drawn
let seed = 1;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

// one post: which rows are framed, each cell's plan of flips, and where the run is
const post = { s, score: 0, framed: [], age: 0, phase: "load", t: 0, beatAt: 0, strikeAt: 0, clearAt: 0 };
const plans = Array.from({ length: 4 }, () => Array.from({ length: COLS }, () => []));
const reading = { p: 0, shown: 0, sent: false, id: 0 };
const dial = { target: 0, shown: 0, has: false };

// a flutter: a cell flips through a couple of random glyphs before it lands
function flutter(plan, t, final, n) {
  for (let i = 0; i < n; i++) plan.push([t + i * FLIP, GLYPHS[Math.floor(rnd() * GLYPHS.length)]]);
  plan.push([t + n * FLIP, final]);
}
function startPost() {
  post.s = s = target; post.score = scoreOf(s); post.framed = framedOf(s);
  post.phase = "load"; post.t = 0; post.age = 0; post.clearAt = 0;
  seed = 1 + Math.floor(s * 1000) + run_ * 7;
  const framed = post.framed.length > 0;
  // the beat: the metronome ticks every BEAT seconds; the framed rows flip on the sixth tick, once every row has
  // landed and its straw man has been struck out
  post.beatAt = BEAT * 0.5 + BEAT * 5;
  post.strikeAt = post.beatAt - 0.85;
  for (let r = 0; r < 4; r++) {
    const isFramed = post.framed.includes(r);
    const first = padOf(isFramed ? PAIRS[r][0] : PLAIN[r]);
    for (let c = 0; c < COLS; c++) {
      const plan = (plans[r][c] = [[-1, " "]]);
      const t0 = 0.25 + r * 0.32 + rnd() * 0.45 + c * 0.035;
      if (first[c] !== " ") flutter(plan, t0, first[c], 1 + Math.floor(rnd() * 3));
      // the framed row: every cell flips to Y at once, on the beat
      if (isFramed) plan.push([post.beatAt, padOf(PAIRS[r][1])[c]]);
    }
  }
  post.loadEnd = framed ? post.beatAt + 0.9 : 2.9;
  reading.p = 0; reading.sent = false; reading.id += 1;
}
function clearBoard() {
  post.clearAt = post.age;
  for (let r = 0; r < 4; r++) for (let c = 0; c < COLS; c++) {
    const plan = plans[r][c], shown = plan[plan.length - 1][1];
    if (shown !== " ") plan.push([post.age + r * 0.08 + c * 0.03 + rnd() * 0.1, " "]);
  }
}
// what a cell shows at a time: the last flip at or before it, and how far through that flip it is
function cellState(plan, t) {
  let i = 0;
  while (i + 1 < plan.length && plan[i + 1][0] <= t) i++;
  const [at_, ch] = plan[i], prev = i > 0 ? plan[i - 1][1] : " ";
  const dur = at_ === post.beatAt ? SNAP : FLIP;
  const p = (t - at_) / dur;
  return p < 1 && i > 0 ? { ch, prev, p } : { ch, prev: ch, p: 1 };
}

function step(dt) {
  post.t += dt; post.age += dt;
  if (post.phase === "load" && post.age > post.loadEnd) { post.phase = "read"; post.t = 0; }
  if (post.phase === "read") {
    if (post.t > 0.5) reading.p = Math.min(1, reading.p + dt / 0.6);
    if (reading.p >= 1 && !reading.sent) {
      reading.sent = true;
      const result = post.score, id = reading.id;
      wires.send(() => { if (id === reading.id) { dial.target = result; dial.has = true; post.phase = "hold"; post.t = 0; } }, result);
    }
  }
  if (post.phase === "hold" && post.t > 2.2) { post.phase = "clear"; post.t = 0; dial.target = 0; dial.has = false; reading.p = 0; reading.id += 1; clearBoard(); }
  if (post.phase === "clear" && post.t > 1.3) { if (touring) { run_ += 1; target = TOUR[run_ % TOUR.length]; } startPost(); }
}

function tileSvg(r, c, x, y, ch, half, scale) {
  // one half of a flap showing one half of a glyph; `scale` folds it towards the hinge
  const hy = y + D.CELL_H / 2, id = (half === "T" ? "smT" : "smB") + r + "_" + c;
  const body = '<rect class="' + (half === "T" ? "sm-tile" : "sm-tile-lo") + '" x="' + f(x) + '" y="' + f(y) + '" width="' + D.CELL_W + '" height="' + D.CELL_H + '" rx=".7"/>'
    + (ch !== " " ? '<text class="sm-glyph" x="' + f(x + D.CELL_W / 2) + '" y="' + f(hy + 0.3) + '">' + (ch === "&" ? "&amp;" : ch) + "</text>" : "");
  const inner = '<g clip-path="url(#' + id + ')">' + body + "</g>";
  return scale === 1 ? inner : '<g transform="translate(0 ' + f(hy) + ") scale(1 " + f(Math.max(0.001, scale)) + ") translate(0 " + f(-hy) + ')">' + inner + "</g>";
}
function cellSvg(r, c, st) {
  const x = D.WIN.u + 0.8 + c * (D.CELL_W + 0.8), y = D.WIN.v + 1.2 + r * D.ROW_H;
  let out;
  if (st.p >= 1) out = tileSvg(r, c, x, y, st.ch, "T", 1) + tileSvg(r, c, x, y, st.ch, "B", 1);
  else {
    // behind: the new glyph's top, the old glyph's bottom; in front, the falling flap
    out = tileSvg(r, c, x, y, st.ch, "T", 1) + tileSvg(r, c, x, y, st.prev, "B", 1);
    out += st.p < 0.5 ? tileSvg(r, c, x, y, st.prev, "T", Math.cos(st.p * Math.PI)) : tileSvg(r, c, x, y, st.ch, "B", -Math.cos(st.p * Math.PI));
  }
  return out + '<path class="sm-hinge" d="M' + f(x) + " " + f(y + D.CELL_H / 2) + "h" + D.CELL_W + '"/>';
}
// the strike through a framed row's straw man, drawn left to right before the beat and gone with it
function strikesSvg(t) {
  let out = "";
  for (const r of post.framed) {
    const len = PAIRS[r][0].length, u = easeIn((t - post.strikeAt) / 0.4);
    if (u <= 0 || t >= post.beatAt + SNAP * 0.5 || post.clearAt) continue;
    const x0 = D.WIN.u + 0.8 - 0.6, w = (len * (D.CELL_W + 0.8) + 0.4) * u, y = D.WIN.v + 1.2 + r * D.ROW_H + D.CELL_H / 2 - 0.55;
    out += '<rect class="sm-strike" x="' + f(x0) + '" y="' + f(y) + '" width="' + f(w) + '" height="1.1" rx=".5"/>';
  }
  return out;
}
let lastKey = "";
function draw() {
  const t = post.age;
  let html = "", key = "";
  for (let r = 0; r < 4; r++) for (let c = 0; c < COLS; c++) {
    const st = cellState(plans[r][c], t);
    key += st.ch + (st.p < 1 ? st.p.toFixed(2) + st.prev : "") + "|";
    html += cellSvg(r, c, st);
  }
  if (key !== lastKey) { cellsEl.innerHTML = html; lastKey = key; }
  strikesEl.innerHTML = strikesSvg(t);
  // the metronome: still for a plain post; ticking for a framed one until the board clears
  const swing = post.framed.length && !post.clearAt ? easeIn(t / 0.6) : Math.max(0, 1 - (t - post.clearAt) / 0.8) * (post.framed.length ? 1 : 0);
  const a = 0.42 * swing * Math.sin((Math.PI * t) / BEAT);
  const [px, py, pz] = D.PEND.pivot, L_ = D.PEND.len;
  const tip = [px + Math.sin(a) * L_, py, pz + Math.cos(a) * L_], bob = [px + Math.sin(a) * L_ * 0.62, py, pz + Math.cos(a) * L_ * 0.62];
  const p0 = iso([px, py, pz], P), p1 = iso(tip, P), b = iso(bob, P), K = D.K;
  pendEl.innerHTML = '<path class="sm-pend" d="M' + f(p0[0]) + " " + f(p0[1]) + "L" + f(p1[0]) + " " + f(p1[1]) + '"/>'
    + '<rect class="sm-bob" x="' + f(b[0] - 1.9 * K) + '" y="' + f(b[1] - 1.4 * K) + '" width="' + f(3.8 * K) + '" height="' + f(2.8 * K) + '" rx="' + f(0.5 * K) + '"/>';
}

function say() {
  const n = post.framed.length;
  const what = n === 0 ? "4 plain rows" : n + " of 4 rows: not X, but Y";
  const text = dial.has ? what + " · score " + Math.round(dial.target) + " · " + bench.verdictOf(Math.round(dial.target))
    : wires.busy() ? what + " · sending…" : post.phase === "clear" ? "clearing the board" : "setting the board…";
  if (readout.textContent !== text) readout.textContent = text;
  const v = "Score " + post.score + ", " + bench.verdictOf(post.score) + ". " + (n === 0 ? "Four plain lines." : n + " of 4 lines knock down a straw man and flip on the same beat.");
  if (stage.getAttribute("aria-valuetext") !== v) { stage.setAttribute("aria-valuenow", String(post.score)); stage.setAttribute("aria-valuetext", v); }
}
function needleEnds(score) {
  const a = D.dialFrom + D.dialSpan * (score / 100);
  const { x, y, r } = D.DIAL;
  return [[x - Math.sin(a) * 3, y + Math.cos(a) * 3], [x + Math.sin(a) * (r - 4), y - Math.cos(a) * (r - 4)]];
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (!calm) { step(dt); wires.step(dt); }
  reading.shown += (reading.p - reading.shown) * (1 - Math.exp(-dt / 0.18));
  dial.shown += (dial.target - dial.shown) * (1 - Math.exp(-dt / 0.3));
  if (calm) { reading.shown = 1; dial.shown = dial.target; }
  draw();
  needle.setAttribute("d", lineOnTop(...needleEnds(dial.shown), D.dialTop + 0.2, P));
  const r = reading.shown, e = r * r * (3 - 2 * r), white = 1 - e;
  const pulse = 0.5 + 0.5 * Math.sin((now / 1000) * Math.PI * 1.6);
  level = calm ? 1 : Math.min(1, level + dt / 0.9);
  bench.drawLamp(stage, 6 + 88 * post.s, level * (1 - white * (0.55 - 0.45 * pulse)), calm ? 0.8 : now / 1000, white);
  wires.bits(!calm && (post.phase === "load" || post.phase === "read") && !reading.sent);
  say();
  frame = visible && !calm ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
let quiet = 0, said = 0;
// a new choice goes up as the next post: clear the board now if a post is showing
const steer = (next) => {
  touring = false;
  target = Math.min(1, Math.max(0, next));
  if (still.matches) { settleStill(); }
  else if (post.phase === "hold" || post.phase === "read") { post.phase = "hold"; post.t = 99; }
  clearTimeout(quiet);
  quiet = setTimeout(() => { if (!still.matches) { touring = true; run_ = Math.max(0, TOUR.findIndex((v) => v >= target - 0.01)); } run(); }, 3600);
  clearTimeout(said);
  said = setTimeout(() => { const sc = scoreOf(target); announce.textContent = "Score " + sc + ", " + bench.verdictOf(sc); }, 700);
  run();
};
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
bench.onTheme(() => run());
let dragging = false;
const fromPointer = (event) => { const box = svg.getBoundingClientRect(); steer(((event.clientX - box.left) / box.width - 0.2) / 0.6); };
stage.addEventListener("pointerdown", (event) => { dragging = true; stage.setPointerCapture(event.pointerId); fromPointer(event); });
stage.addEventListener("pointermove", (event) => { if (dragging) fromPointer(event); });
const release = () => { dragging = false; };
stage.addEventListener("pointerup", release);
stage.addEventListener("pointercancel", release);
stage.addEventListener("keydown", (event) => {
  let to = null;
  const step_ = event.shiftKey ? 0.25 : 0.1;
  if (event.key === "ArrowRight" || event.key === "ArrowUp") to = target + step_;
  if (event.key === "ArrowLeft" || event.key === "ArrowDown") to = target - step_;
  if (event.key === "Home") to = 0;
  if (event.key === "End") to = 1;
  if (to === null) return;
  event.preventDefault();
  steer(to);
});
// reduced motion: one post on the board, after the beat, read
function settleStill() {
  startPost();
  post.age = post.loadEnd + 0.5;
  reading.p = 1; dial.target = post.score; dial.has = true; post.phase = "hold";
  lastKey = "";
  run();
}
if (still.matches) { target = 0.5; settleStill(); } else startPost();
draw();
</script>
</body></html>
