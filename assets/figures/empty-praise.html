<script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}

const LINE_W = [0.62,0.92,0.78,0.96,0.7,0.86];
// S4 Empty praise: the model. One number, `s` (0 clean to 1 sloppy), sets what a post puts in the display case.
// Clean, the object (what the post is actually about) rises into the case and a small plaque names it. Sloppy, the
// plaque grows line by line with praise and the spotlight brightens, while the object sinks back into the plinth,
// until the light falls on an empty case.
// Inlined into the page as source (no imports).

const PLINTH = { x: -106, y: -40, w: 76, d: 76 }; // the plinth's body
const PLINTH_H = 48; // top of the cornice
const CASE = { x: -96, y: -30, w: 56, d: 56 }; // the glass case on top
const FLOOR = 54; // the case floor
const GLASS_TOP = 102;
const HATCH = { x: -68, y: -2, r: 12 }; // the lift's hatch in the case floor
const OBJECT_H = 31; // the urn, foot to lip
const PLAQUE = { x: -68, z: 25 }; // centre of the plaque on the plinth's front face
const LINES = 6; // the most lines of praise the plaque holds

const clamp01 = (v) => Math.min(1, Math.max(0, v));
const ease = (v) => { const t = clamp01(v); return t * t * (3 - 2 * t); };

const scoreOf = (s) => Math.round(6 + 88 * s);
// how much of the object shows above the case floor: all of it when clean, none when sloppy
const riseOf = (s) => 1 - ease((s - 0.15) / 0.7);
// the plaque: one line naming the object when clean, six lines of praise when sloppy; it widens and grows with them
const linesOf = (s) => 1 + Math.round(5 * clamp01(s));
const plaqueWOf = (s) => 20 + 36 * ease(s);
const plaqueHOf = (lines) => 5 + 3.2 * lines;
// the spotlight: a working light when clean, full glare when sloppy
const spotOf = (s) => 0.3 + 0.7 * ease(s);


const bench = (() => {

const easeIn = (v) => ease(v);

function startPost() {

function draw() {

  objectEl.setAttribute("transform", translateAlong(P, [0, 0, FLOOR - (1 - show.rise) * (OBJECT_H + 4)]));
  plaqueEl.innerHTML = plaqueSvg();
  sparklesEl.innerHTML = D.SPARKS.map((p, i) => [p, sparkleOf(i)]).filter(([, a]) => a > 0.03).map(([p, a]) => sparkSvg(p, a)).join("");

function say() {
  const lines = post.lines + (post.lines === 1 ? " line" : " lines") + " on the plaque";
  const text = dial.has ? lines + " · score " + Math.round(dial.target) + " · " + bench.verdictOf(Math.round(dial.target))
    : wires.busy() ? lines + " · sending…" : post.phase === "load" || post.phase === "read" ? "unveiling…" : "clearing the case";
  if (readout.textContent !== text) readout.textContent = text;
  const v = "Score " + post.score + ", " + bench.verdictOf(post.score) + ". " + Math.round(post.rise * 100) + "% of the object on show, " + post.lines + (post.lines === 1 ? " line" : " lines") + " on the plaque.";

function tick(now) {

  clock = now / 1000;

  reading.shown += (reading.p - reading.shown) * (1 - Math.exp(-dt / 0.18));
  dial.shown += (dial.target - dial.shown) * (1 - Math.exp(-dt / 0.3));

const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };

  quiet = setTimeout(() => { if (!still.matches) { touring = true; run_ = Math.max(0, TOUR.findIndex((v) => v >= target - 0.01)); } run(); }, 3600);
  clearTimeout(said);

let dragging = false;
