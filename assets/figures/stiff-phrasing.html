 the real words along until the line is three times as long, and the clamp ratchets out tooth by tooth to hold it. The stick streams the line to the lamp, which pulses white while the type is set, then lights the score (blue below 40, yellow from 40, red from 70) and sends it straight to the dial. The type is lifted out between posts and the dial drops back to zero.</span></figcaption></figure>

<script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {

    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";

}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],

    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {

}
function signedArea(points) {

function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);

        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)

function runsOf(flags, want) {

        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];

    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);

            runs.push(run);

function extrude(ring, z, height, projection, options = {}) {

        fill,
        outline: outline.join(""),
        crease: crease.join(""),

function slabOf(plan, z, height, projection, steps = 8, bevel = 0) {
    return extrude(ringOf(plan, steps), z, height, projection, { convex: true, bevel });

function circleRing(cx, cy, radius, steps = 40) {
    return Array.from({ length: steps }, (_, step) => {
        const angle = (step / steps) * Math.PI * 2;
        return [cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)];

  const smooth01 = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const colourOf = (score) => {
    const y = smooth01(34, 46, score), r = smooth01(64, 76, score);
    return [0, 1, 2].map((i) => (pal[0][i] * (1 - y) + pal[1][i] * y) * (1 - r) + pal[2][i] * r);
  };
  const verdictOf = (score) => score >= D.zones.likely ? "Likely slop" : score >= D.zones.possibly ? "Possibly slop" : "Looks fine";
  const listeners = [];
  const onTheme = (fn) => listeners.push(fn);
  const fire = () => { readPalette(); listeners.forEach((fn) => fn(isDark())); };
  mq.addEventListener("change", fire);
  new MutationObserver(fire).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  let layer = null;
  const mount = (stage) => {
    const canvas = stage.querySelector(".sm-gl");
    layer = canvas ? glLayer({ canvas, fragment: D.lampFragment, view: [D.W, D.H], camera: D.camera, uniforms: ["uCol", "uLevel", "uLight"] }) : null;
    if (layer) stage.setAttribute("data-gl", "");
    return layer;
  };
  // white: 0 shows the score colour, 1 the lamp's idle white (no reading yet)
  const drawLamp = (stage, score, level, time, white = 0) => {
    const c = colourOf(score);
    const col = c.map((v, i) => v * (1 - white) + pal[3][i] * white);
    const rgb = (v) => "rgb(" + v.map((x) => Math.round(x * 255)).join(",") + ")";
    stage.style.setProperty("--sm-lamp", rgb(col));
    stage.style.setProperty("--sm-bits", rgb(c.map((v, i) => v * (1 - white) + pal[4][i] * white)));
    if (layer) layer.draw({ uCol: col, uLevel: level, uLight: isDark() ? 0 : 1 }, time);
  };
  // The wires: bits stream from the machine to the lamp while it is reading; a single pulse carries the result from
  // the lamp to the dial, and the dial moves only when it arrives.
  const wires = (stage) => {
    const inn = stage.querySelector('[data-cable="in"]'), out = stage.querySelector('[data-cable="out"]');
    const len = out ? out.getTotalLength() : 0;
    let at = -1, done = null;
    return {
      bits(on) { if (inn) { if (on) inn.setAttribute("data-on", ""); else inn.removeAttribute("data-on"); } },
      send(then, score) { at = 0; done = then; if (out && score != null) out.style.stroke = "rgb(" + colourOf(score).map((v) => Math.round(v * 255)).join(",") + ")"; if (!out) { at = -1; then && then(); } },
      busy: () => at >= 0,
      step(dt) {
        if (at < 0) return;
        at += dt / 0.75;
        if (at >= 1) { at = -1; out.removeAttribute("data-on"); const f = done; done = null; if (f) f(); return; }
        const seg = 11;
        out.setAttribute("data-on", "");
        out.style.strokeDasharray = seg + " " + (len + 40);
        out.style.strokeDashoffset = String(-(at * len) + seg * 0.5);
      },
    };
  };
  return { isDark, colourOf, verdictOf, onTheme, mount, drawLamp, wires };
})();

// S8 Stiff phrasing: the live part, inlined after the model and the bench runtime.
const P = D.P;
const stage = document.querySelector(".sm-stage");
const svg = stage.querySelector("svg");
const q = (name) => svg.querySelector('[data-part="' + name + '"]');
const slugsEl = q("slugs"), clampEl = q("clamp"), pawlEl = q("pawl"), needle = q("needle");
const slugEls = Object.fromEntries([...svg.querySelectorAll("[data-slug]")].map((el) => [el.getAttribute("data-slug"), el]));
const readout = document.querySelector("[data-readout]");
const announce = stage.querySelector("[data-announce]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
bench.mount(stage);
const wires = bench.wires(stage);

const TOUR = [0.08, 0.5, 0.92, 0.5];
let s = 0.08, target = s, touring = !still.matches, run_ = 0;
let level = 0, frame = 0, last = 0, visible = false;
const clamp = (v) => Math.min(1, Math.max(0, v));
const easeIn = (v) => { const t = clamp(v); return t * t * (3 - 2 * t); };
const f = (v) => v.toFixed(2);
const pt = (p) => { const c = iso(p, P); return f(c[0]) + " " + f(c[1]); };
const LAND = 0.32, WEDGE = 0.62; // seconds per word set, per insert wedged in

// one post: how many inserts, and where the run is
const post = { s, score: 0, n: 0, phase: "load", t: 0, got: false };
// each slug: where it sits along the line, how high above the floor (dropping in, lifted out), how visible
const state = {};
for (const id of Object.keys(slugEls)) state[id] = { x: X0, z: 0, a: 0, on: false };
const clampState = { x: clampOf(X0 + 2), shown: clampOf(X0 + 2), end: X0 + 2, jolt: 0, step: 0 };
const reading = { p: 0, shown: 0, sent: false, id: 0 };
const dial = { target: 0, shown: 0, has: false };

function startPost() {
  post.s = s = target; post.score = scoreOf(s); post.n = insertsOf(s);
  post.phase = "load"; post.t = 0; post.got = false;
  for (const st of Object.values(state)) { st.on = false; st.a = 0; }
  reading.p = 0; reading.sent = false; reading.id += 1;
}
const loadTime = () => WORDS.length * LAND + 0.3 + post.n * WEDGE + 0.3;

// where everything is at a time in the load: words drop in one by one, then each insert shoves the words right of it
// along and drops into the gap
function layoutAt(t) {
  const wordsDone = WORDS.length * LAND + 0.3;
  if (t < wordsDone) {
    const line = lineOf(0);
    line.seq.forEach((sl, i) => { const u = (t - i * LAND) / LAND; place(sl.id, sl.x, u); });
    const landed = line.seq.filter((_, i) => t >= (i + 0.7) * LAND);
    return landed.length ? landed[landed.length - 1].x + widthOf(landed[landed.length - 1]) : X0;
  }
  const k = Math.min(post.n, Math.floor((t - wordsDone) / WEDGE)), u = (t - wordsDone - k * WEDGE) / WEDGE;
  const before = lineOf(k), after = k < post.n ? lineOf(k + 1) : before;
  const shove = easeIn(u / 0.5), drop = (u - 0.45) / 0.45;
  for (const sl of after.seq) {
    const was = before.seq.find((b) => b.id === sl.id);
    if (was) place(sl.id, was.x + (sl.x - was.x) * shove, 1);
    else place(sl.id, sl.x, drop);
  }
  return before.end + (after.end - before.end) * shove;
}
function place(id, x, u) {
  const st = state[id];
  if (u <= 0) { st.on = false; return; }
  st.on = true; st.x = x; st.a = 1;
  const e = clamp(u);
  st.z = 22 * (1 - e) * (1 - e);
}

function step(dt) {
  post.t += dt;
  if (post.phase === "load") {
    const end = layoutAt(post.t);
    clampState.end = Math.max(end, X0 + 2);
    clampState.x = clampOf(clampState.end);
    // the lamp reads the line as it is set and settles as the last slug lands; the pulse leaves at once
    reading.p = clamp((post.t - 0.4) / (loadTime() - 0.4));
    if (post.t >= loadTime()) { post.phase = "read"; post.t = 0; }
  }
  if ((post.phase === "load" || post.phase === "read") && reading.p >= 1 && !reading.sent) {
    reading.sent = true;
    const result = post.score, id = reading.id;
    wires.send(() => { if (id === reading.id) { dial.target = result; dial.has = true; post.phase = "hold"; post.t = 0; } }, result);
  }
  if (post.phase === "hold" && post.t > 2.4) { post.phase = "clear"; post.t = 0; dial.target = 0; dial.has = false; reading.p = 0; reading.id += 1; }
  if (post.phase === "clear") {
    // the line is lifted out, then the clamp is released and slides home
    for (const st of Object.values(state)) if (st.on) { st.z = 18 * easeIn(post.t / 0.7); st.a = 1 - easeIn((post.t - 0.2) / 0.5); }
    if (post.t > 0.75) clampState.x = clampOf(X0 + 2);
    if (post.t > 1.6) { if (touring) { run_ += 1; target = TOUR[run_ % TOUR.length]; } startPost(); }
  }
  // the clamp: pushed out it ratchets, a tooth at a time with a click; released it slides back smoothly
  // the line pushes it directly, clicking at every tooth it passes, then it settles into the next tooth
  const pushed = post.phase === "load" ? clampState.end + 0.6 : -Infinity;
  if (pushed > clampState.shown) {
    if (Math.floor((pushed - X0) / PITCH) > Math.floor((clampState.shown - X0) / PITCH)) clampState.jolt = 1;
    clampState.shown = pushed;
  } else if (clampState.x > clampState.shown + 0.01) {
    clampState.step -= dt;
    if (clampState.step <= 0) { clampState.shown = Math.min(clampState.x, clampState.shown + PITCH); clampState.jolt = 1; clampState.step = 0.07; }
  } else if (clampState.x < clampState.shown && post.phase !== "load") {
    clampState.shown += (clampState.x - clampState.shown) * (1 - Math.exp(-dt / 0.18));
  }
  clampState.jolt *= Math.exp(-dt / 0.06);
}

// a box seen from the camera: its top, its front (+y) and its right (+x) faces
function box(x0, x1, y0, y1, z0, z1, cls = "") {
  const top = [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]].map(pt);
  const fr = [[x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [x0, y1, z0]].map(pt);
  const rt = [[x1, y0, z1], [x1, y1, z1], [x1, y1, z0], [x1, y0, z0]].map(pt);
  const face = (p, c) => '<path class="' + c + '" d="M' + p.join("L") + 'Z"/>';
  return '<g class="' + cls + '">' + face(top, "sm-boxtop") + face(fr, 'iso-shade" data-shade="2') + face(rt, 'iso-shade" data-shade="1')
    + '<path class="iso-line" data-tone="mid" d="M' + top.join("L") + "ZM" + fr.join("L") + "ZM" + rt.join("L") + 'Z"/></g>';
}
function clampSvg(cx) {
  const st = D.STICK, z0 = D.FLOOR, z1 = D.FLOOR + D.WALL_H + 1.5;
  // the knee: a block across the stick, with a locking lever on top that kicks at every tooth
  let out = box(cx, cx + 6, st.y + 3, st.y + st.d - 1.6, z0, z1);
  const kick = 0.5 * clampState.jolt, piv = [cx + 3, st.y + st.d - 4, z1];
  const tip = [cx + 3 + 7 * Math.cos(0.5 + kick), st.y + st.d - 4, z1 + 7 * Math.sin(0.5 + kick)];
  out += '<path class="iso-line" data-tone="hi" style="stroke-width:1.6" d="M' + pt(piv) + "L" + pt(tip) + '"/>';
  const tc = iso(tip, P), pc = iso(piv, P);
  out += '<circle class="sm-knob" cx="' + f(tc[0]) + '" cy="' + f(tc[1]) + '" r="' + f(1.6 * D.K) + '"/>';
  out += '<circle class="sm-pellet" cx="' + f(pc[0]) + '" cy="' + f(pc[1]) + '" r="' + f(0.6 * D.K) + '"/>';
  return out;
}
function pawlSvg(cx) {
  // the pawl: a small tongue from the knee into the rack's teeth, lifting as it clicks over each one
  const lift = 1.2 * clampState.jolt, y0 = D.RACK_Y, y1 = D.STICK.y + D.STICK.d - 0.6, z = D.FLOOR + 1.4 + lift;
  return box(cx - 2, cx + 0.6, y0 + 0.3, y1 - 0.3, z, z + 1.4);
}

function draw() {
  // slugs: nearer (further right) drawn later
  const ids = Object.keys(state).sort((a, b) => state[a].x - state[b].x);
  ids.forEach((id, i) => {
    const st = state[id], el = slugEls[id];
    el.style.visibility = st.on ? "" : "hidden";
    if (st.on) { el.setAttribute("transform", translateAlong(P, [st.x, 0, D.FLOOR + st.z])); el.style.opacity = st.a.toFixed(2); }
    if (slugsEl.children[i] !== el) slugsEl.insertBefore(el, slugsEl.children[i]);
  });
  clampEl.innerHTML = clampSvg(clampState.shown);
  pawlEl.innerHTML = pawlSvg(clampState.shown);
}

function say() {
  const line = lineOf(post.n), hedges = INSERTS.slice(0, post.n).filter((i) => i.kind === "hedge").length, leads = post.n - hedges;
  const what = post.n === 0 ? "4 words, set tight" : hedges + (hedges === 1 ? " hedge" : " hedges") + " · " + leads + (leads === 1 ? " lead" : " leads");
  const text = dial.has ? what + " · score " + Math.round(dial.target) + " · " + bench.verdictOf(Math.round(dial.target))
    : wires.busy() ? what + " · sending…" : post.phase === "clear" ? "lifting the line" : "setting the line…";
  if (readout.textContent !== text) readout.textContent = text;
  const words = line.seq.map((sl) => (sl.kind === "space" ? "(blank)" : sl.text)).join(" ");
  const v = "Score " + post.score + ", " + bench.verdictOf(post.score) + ". The line reads: " + words;
  if (stage.getAttribute("aria-valuetext") !== v) { stage.setAttribute("aria-valuenow", String(post.score)); stage.setAttribute("aria-valuetext", v); }
}
function needleEnds(score) {
  const a = D.dialFrom + D.dialSpan * (score / 100);
  const { x, y, r } = D.DIAL;
  return [[x - Math.sin(a) * 3, y + Math.cos(a) * 3], [x + Math.sin(a) * (r - 4), y - Math.cos(a) * (r - 4)]];
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (!calm) { step(dt); wires.step(dt); }
  reading.shown += (reading.p - reading.shown) * (1 - Math.exp(-dt / 0.18));
  dial.shown += (dial.target - dial.shown) * (1 - Math.exp(-dt / 0.3));
  if (calm) { reading.shown = 1; dial.shown = dial.target; }
  draw();
  needle.setAttribute("d", lineOnTop(...needleEnds(dial.shown), D.dialTop + 0.2, P));
  const r = reading.shown, e = r * r * (3 - 2 * r), white = 1 - e;
  const pulse = 0.5 + 0.5 * Math.sin((now / 1000) * Math.PI * 1.6);
  level = calm ? 1 : Math.min(1, level + dt / 0.9);
  bench.drawLamp(stage, 6 + 88 * post.s, level * (1 - white * (0.55 - 0.45 * pulse)), calm ? 0.8 : now / 1000, white);
  wires.bits(!calm && (post.phase === "load" || post.phase === "read") && !reading.sent);
  say();
  frame = visible && !calm ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
let quiet = 0, said = 0;
// a new choice is set as the next post: lift the line now if one is showing
const steer = (next) => {
  touring = false;
  target = Math.min(1, Math.max(0, next));
  if (still.matches) { settleStill(); }
  else if (post.phase === "hold" || post.phase === "read") { post.phase = "hold"; post.t = 99; }
  clearTimeout(quiet);
  quiet = setTimeout(() => { if (!still.matches) { touring = true; run_ = Math.max(0, TOUR.findIndex((v) => v >= target - 0.01)); } run(); }, 3600);
  clearTimeout(said);
  said = setTimeout(() => { const sc = scoreOf(target); announce.textContent = "Score " + sc + ", " + bench.verdictOf(sc); }, 700);
  run();
};
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
bench.onTheme(() => run());
let dragging = false;
const fromPointer = (event) => { const b = svg.getBoundingClientRect(); steer(((event.clientX - b.left) / b.width - 0.2) / 0.6); };
stage.addEventListener("pointerdown", (event) => { dragging = true; stage.setPointerCapture(event.pointerId); fromPointer(event); });
stage.addEventListener("pointermove", (event) => { if (dragging) fromPointer(event); });
const release = () => { dragging = false; };
stage.addEventListener("pointerup", release);
stage.addEventListener("pointercancel", release);
stage.addEventListener("keydown", (event) => {
  let to = null;
  const step_ = event.shiftKey ? 0.25 : 0.1;
  if (event.key === "ArrowRight" || event.key === "ArrowUp") to = target + step_;
  if (event.key === "ArrowLeft" || event.key === "ArrowDown") to = target - step_;
  if (event.key === "Home") to = 0;
  if (event.key === "End") to = 1;
  if (to === null) return;
  event.preventDefault();
  steer(to);
});
// reduced motion: one line set, read
function settleStill() {
  startPost();
  for (const st of Object.values(state)) st.on = false;
  const line = lineOf(post.n);
  for (const sl of line.seq) { const st = state[sl.id]; st.on = true; st.x = sl.x; st.z = 0; st.a = 1; }
  clampState.x = clampState.shown = clampOf(line.end);
  reading.p = 1; dial.target = post.score; dial.has = true; post.phase = "hold";
  run();
}
if (still.matches) { target = 0.5; settleStill(); } else startPost();
draw();
</script>
