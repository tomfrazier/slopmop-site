>Each slug is one line of a post. Written as a plain paragraph, the lines lie packed together and the thumb rolls straight across. The scroll-stopper pattern turns the opener into a tall headline, opens a gap after every line and stands each line on its own riser, so the post becomes a staircase: the thumb is slowed on each tall line and drops one line at a time down to the moral. A reader box on the galley streams each run to the lamp, which pulses white until the ball has crossed the first three lines and then lights the score: blue below 40, yellow from 40, red from 70. As soon as the lamp has its colour it sends the result down the second cable and the dial swings to it; when the ball drops into the drain the dial falls back to zero and the lamp to white.</span></figcaption></figure>

<script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
