ped one is one weight and five balloons, so it looks bigger and weighs almost nothing. The scale streams its reading to the lamp, which pulses white while it weighs, then lights the score (blue below 40, yellow from 40, red from 70) and sends it straight to the dial. A squeegee sweeps the pan between posts and the dial drops back to zero.</span></figcaption></figure>

<script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],

// S3 Hype words: the model. One number, `s` (0 clean to 1 sloppy), sets what a post puts on the scale: brass weights
// (numbers, named examples, specifics) or balloons (hype words: big, bright and weightless). Clean, six weights and no
// balloons; sloppy, one weight and five balloons. The scale reads only the weights.
// Inlined into the page as source (no imports).

const PAN = { x: -96, y: -30, w: 76, d: 52 }; // the weighing pan
const PAN_TOP = 23; // pan top at rest, empty
const WEIGHT = { r: 4.4, grams: 50 }; // one brass weight, knob included
const FUNNEL = { x: -16, y: -28, w: 24, d: 44, top: 18 }; // the chute the swept weights fall into
const BAR_REST = -104; // the squeegee bar's x when parked
const BAR_END = -10; // the end of its sweep
const GRAMS_FULL = 300; // the scale face's full turn

// where the weights sit, in the order they are placed, and where the balloons are tied (on the rim) and float
const SPOTS = [[-84, -16], [-70, 6], [-54, -16], [-38, 6], [-84, 10], [-58, -4]];
const TIES = [[-90, -25], [-44, -26], [-88, 17], [-27, -12], [-58, 17]];
const FLOATS = [[-100, -34, 80], [-40, -40, 98], [-90, 10, 100], [-20, -14, 78], [-58, 24, 90]];

// likely slop: the balloons swell, so they spread out to stay clear of each other
const RED_FLOATS = [[-84, -31, 103], [-41, -29, 68], [-103, 32, 107], [-5, -34, 116], [-67, 26, 76]];
const RED_GROW = 1.45;

const scoreOf = (s) => Math.round(6 + 88 * s);
const weightsOf = (s) => Math.round(6 - 5 * s);
const balloonsOf = (s) => Math.round(5 * s);
// how far the pan sinks under its load (the scale's spring)
const sinkOf = (grams) => -Math.min(4, grams * 0.012);


const bench = (() => {

const P = D.P, K = D.K;
const stage = document.querySelector(".sm-stage");

const TOUR = [0.08, 0.5, 0.92, 0.5];
let s = 0.08, target = s, touring = !still.matches, run_ = 0;

// one post: its weights and balloons, and where the run is
const post = { s, nW: 0, nB: 0, phase: "load", t: 0, score: 0 };

function startPost() {

const loadTime = () => Math.max(0.2 + 0.32 * (post.nW - 1) + 0.7, 0.35 + 0.38 * (post.nB - 1) + 1.0, 1.2);

    : '<path class="sm-string" d="M' + f(tie[0]) + " " + f(tie[1]) + "Q" + f((tie[0] + bottom[0]) / 2 + 3) + " " + f((tie[1] + bottom[1]) / 2) + " " + f(bottom[0]) + " " + f(bottom[1]) + '"/>';

    + '<path class="sm-balloon" d="M' + f(bottom[0] - r * 0.16) + " " + f(bottom[1] + r * 0.14) + "L" + f(bottom[0] + r * 0.16) + " " + f(bottom[1] + r * 0.14) + "L" + f(bottom[0]) + " " + f(bottom[1] - r * 0.05) + 'Z"/>'

    + '<path class="sm-glint" d="M' + f(c[0] - r * 0.55) + " " + f(c[1] - r * 0.25) + "A" + f(r * 0.6) + " " + f(r * 0.6) + " 0 0 1 " + f(c[0] - r * 0.15) + " " + f(c[1] - r * 0.6) + '"/></g>';

function draw() {

  barEl.setAttribute("transform", translateAlong(P, [barX - BAR_REST, 0, 0]));
  barFrontEl.setAttribute("transform", translateAlong(P, [barX - BAR_REST, 0, 0]));

    const el = weightEls[i];

function say() {
  const text = dial.has ? Math.round(grams) + " g · score " + Math.round(dial.target) + " · " + bench.verdictOf(Math.round(dial.target))
    : wires.busy() ? Math.round(grams) + " g · sending…" : post.phase === "load" || post.phase === "read" ? "weighing…" : "clearing the pan";
  if (readout.textContent !== text) readout.textContent = text;
  const v = "Score " + post.score + ", " + bench.verdictOf(post.score) + ". " + post.nW + (post.nW === 1 ? " weight" : " weights") + " and " + post.nB + (post.nB === 1 ? " balloon" : " balloons") + " on the scale.";

function needleEnds(score) {

  return [[x - Math.sin(a) * 3, y + Math.cos(a) * 3], [x + Math.sin(a) * (r - 4), y - Math.cos(a) * (r - 4)]];

function tick(now) {

const steer = (next) => {

let dragging = false;

  if (event.key === "ArrowLeft" || event.key === "ArrowDown") to = target - step_;

  grams = weights.filter((w) => w.state === "pan").length * WEIGHT.grams;
  pan.z = PAN_TOP + sinkOf(grams);
  weights.forEach((w) => { if (w.state === "pan") w.z = pan.z; });
  balloons.forEach((b) => { if (b.state === "wait") { b.state = "held"; b.grow = 1; b.x = b.fx; b.y = b.fy; b.z = b.fz; } });
