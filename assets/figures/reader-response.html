<figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Reader response</span><span class="iso-plate-corner" data-corner="hint">Drag across · ← →</span><span class="iso-plate-corner" data-corner="readout" data-readout>waiting for a post</span></div><div class="sm-stage" tabindex="0" role="slider" aria-label="Reader response. Left and right arrow keys set how much real response the next post drew; Home and End go to a real discussion and to nothing but likes." aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg" viewBox="0 0 600 400" role="img" aria-label="A bench with a sieve and a scale on the right, and an adding machine and a printer on the left. A hopper pours the post's responses onto a sloping sieve. Replies and reposts that say something are heavy steel balls: they roll off the sieve into a weighing pan. Likes and bare reactions are light beads: they drop through the mesh into a tray. The adding machine types in the pan's weight, then adds the tray's small share, because a flood of likes counts for little. Then the big PRINT key is pressed and the printer prints the total, out of 100."><defs><radialGradient id="smSteel" cx=".35" cy=".35" r=".75"><stop offset="0" class="sm-steel0"/><stop offset="1" class="sm-steel1"/></radialGradient></defs><path class="iso-halo" d="M27.9 162.1L28.1 160.7L28.9 159.4L30.3 158.2L32 157.1L192.3 77L194.5 76.1L196.9 75.4L199.6 75L202.3 74.9L205.1 75L207.7 75.4L210.2 76.1L212.3 77L568 254.8L569.7 255.9L571.1 257.1L571.9 258.4L572.1 259.8L572.1 278.2L571.9 279.6L571.1 280.9L569.7 282.1L568 283.2L407.7 363.4L405.5 364.2L403.1 364.9L400.4 365.3L397.7 365.4L394.9 365.3L392.3 364.9L389.8 364.2L387.7 363.4L32 185.5L30.3 184.5L28.9 183.2L28.1 181.9L27.9 180.5Z"/><g class="iso-solid"><path class="iso-fill" d="M190 116.2L190 114.8L190.6 113.4L191.8 112.2L193.6 111.1L195.7 110.2L198.2 109.6L20  bare reactions are easy and light. The hopper pours out what the post drew. Replies and reposts are heavy steel balls: they roll down the sieve and into the weighing pan. Likes are beads: they drop through the mesh into the tray below. The adding machine types in the pan's weight, then adds the tray's share, which is never more than a few points however full the tray gets: a flood of likes counts for little. Only then is the big PRINT key pressed, and the printer prints the same total, large, on blue-bar paper, which is torn off for the next post. This is a counter-signal, a plain score out of 100: the higher it is, the more real response the post drew, and the more it pulls a slop score down.</span></figcaption></figure>

<script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;

function iso([x, y, z], projection) {

function towardViewer(projection) {

function depthOf([x, y, z], projection) {

const tenth = (value) => {

};
function pathOf(points, closed = false) {

function roundedPlan({ x, y, w, d, r }, steps = 8) {

        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],

      send(then, score) { at = 0; done = then; if (out && score != null) out.style.stroke = "rgb(" + colourOf(score).map((v) => Math.round(v * 255)).join(",") + ")"; if (!out) { at = -1; then && then(); } },
      busy: () => at >= 0,
      step(dt) {
        if (at < 0) return;
        at += dt / 0.75;
        if (at >= 1) { at = -1; out.removeAttribute("data-on"); const f = done; done = null; if (f) f(); return; }
        const seg = 11;
        out.setAttribute("data-on", "");
        out.style.strokeDasharray = seg + " " + (len + 40);
        out.style.strokeDashoffset = String(-(at * len) + seg * 0.5);
      },
    };
  };
  return { isDark, colourOf, verdictOf, onTheme, mount, drawLamp, wires };
})();

// C3 Reader response: the live part, inlined after the model and the bench runtime.
const P = D.P;
const stage = document.querySelector(".sm-stage");
const svg = stage.querySelector("svg");
const q = (name) => svg.querySelector('[data-part="' + name + '"]');
const ready = q("ready"), keyEl = q("printkey"), sheetEl = q("sheet"), printedEl = q("printed"), feedEl = q("feedbars");
const panEl = q("pan"), pointerEl = q("pointer"), levelEl = q("level"), scaleLight = q("scalelight"), trayLight = q("traylight");
const scaleWire = svg.querySelector('[data-cable="scale"]'), trayWire = svg.querySelector('[data-cable="tray"]');
const layer = (name) => svg.querySelector('[data-layer="' + name + '"]');
const aboveEl = layer("above"), belowEl = layer("below"), panLayer = layer("pan");
const keyEls = {};
svg.querySelectorAll("[data-key]").forEach((el) => { keyEls[el.getAttribute("data-key")] = el; });
const drums = [...svg.querySelectorAll("[data-drum]")];
const readout = document.querySelector("[data-readout]");
const announce = stage.querySelector("[data-announce]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const wires = bench.wires(stage);

const TOUR = [0.08, 0.5, 0.92, 0.5];
let s = TOUR[0], target = s, touring = !still.matches, run_ = 0;
let frame = 0, last = 0, visible = false;
const clamp = (v) => Math.min(1, Math.max(0, v));
const ease = (v) => { const t = clamp(v); return t * t * (3 - 2 * t); };
const f = (v) => v.toFixed(2);
const onOff = (el, on) => { if (!el) return; if (on) el.setAttribute("data-on", ""); else el.removeAttribute("data-on"); };

// one post, end to end: the hopper pours, the balls roll on to the pan and the beads drop into the tray; the scale is
// read and its weight typed; the tray is read and its share added; a pause, then PRINT
const LOAD = 0.5, SETTLE = 1.7, GAP = 0.35, PAUSE = 0.5;
const post = { s, score: 0, phase: "run", t: 0, fade: 0, sent: false, id: 0, feed: 0, parts: [0, 0], keys: [[], []], at: {}, balls: [], beads: [] };

// the camera, for drawing the balls and beads where they are
const O = iso([0, 0, 0], P), Z1 = iso([0, 0, 1], P), PX_PER = Math.hypot(Z1[0] - O[0], Z1[1] - O[1]) / Math.cos(Math.PI / 6);
const BALL_R = 2.5, BEAD_R = 0.95;
const sieveZ = (x) => D.SV.z0 + ((x - D.SV.x0) * (D.SV.z1 - D.SV.z0)) / (D.SV.x1 - D.SV.x0);
const panTop = D.SCALE.panZ + 3;
// the pan's spots, middle first then a ring and a wider ring
const SPOTS = [[0, 0], ...Array.from({ length: 6 }, (_, i) => [5.2 * Math.cos((i * Math.PI) / 3), 5.2 * Math.sin((i * Math.PI) / 3)]), ...Array.from({ length: 8 }, (_, i) => [9.4 * Math.cos((i * Math.PI) / 4 + 0.4), 9.4 * Math.sin((i * Math.PI) / 4 + 0.4)])];
const lerp = (a, b, k) => a + (b - a) * k;
// a ball: drops from the outlet on to the sieve, rolls down it gathering speed, falls off the lip into the pan
function ballAt(b, t) {
  const t1 = b.t0 + 0.22, t2 = t1 + 0.95, t3 = t2 + 0.3;
  const x0 = D.HOP.cx + b.jx, y = D.HOP.cy + b.jy, x1 = D.SV.x1 + 1.5;
  if (t < b.t0) return null;
  if (t < t1) { const k = (t - b.t0) / 0.22; return { p: [x0, y, lerp(D.HOP.z0 - 1, sieveZ(x0) + BALL_R, k * k)], landed: false }; }
  if (t < t2) { const k = (t - t1) / 0.95, x = lerp(x0, x1, k * k); return { p: [x, y, sieveZ(x) + BALL_R], landed: false }; }
  const [sx, sy] = SPOTS[b.spot], tx = D.SCALE.cx + sx, ty = D.SCALE.cy + sy;
  if (t < t3) { const k = (t - t2) / 0.3; return { p: [lerp(x1, tx, k), lerp(y, ty, k), lerp(sieveZ(x1) + BALL_R, panTop + BALL_R + panDrop(), k * k)], landed: false }; }
  return { p: [tx, ty, panTop + BALL_R], landed: true };
}
// a bead: drops on to the sieve, through the mesh and into the tray
function beadAt(b, t) {
  const t1 = b.t0 + 0.22, t2 = t1 + 0.4;
  const x0 = D.HOP.cx + b.jx, y0 = D.HOP.cy + b.jy;
  if (t < b.t0) return null;
  if (t < t1) { const k = (t - b.t0) / 0.22; return { p: [x0, y0, lerp(D.HOP.z0 - 1, sieveZ(x0), k * k)], below: false, landed: false }; }
  const x = b.lx, y = b.ly, z = 1.6 + b.lz;
  if (t < t2) { const k = (t - t1) / 0.4; return { p: [lerp(x0, x, k), lerp(y0, y, k), lerp(sieveZ(x0) - 0.6, z, k * k)], below: true, landed: false }; }
  return { p: [x, y, z], below: true, landed: true };
}
let landedBalls = 0, landedBeads = 0, panShown = 0;
const panDrop = () => -2.4 * (panShown / BALLS_MAX);

function startPost() {
  post.s = s = target; post.score = scoreOf(s);
  post.parts = partsOf(post.score);
  post.keys = post.parts.map(keysOf);
  const seed = 1.3 + run_ * 2.71 + s * 7;
  const nb = ballsOf(post.score), nd = beadsOf(post.score);
  // the mix pours out of the hopper in a stream, balls and beads together
  post.balls = Array.from({ length: nb }, (_, i) => ({ t0: LOAD + (POUR * 0.85 * (i + hash(seed + i) * 0.6)) / nb, jx: (hash(seed + i * 3) - 0.5) * 3, jy: (hash(seed + i * 5) - 0.5) * 12, spot: i }));
  post.beads = Array.from({ length: nd }, (_, i) => ({ t0: LOAD + (POUR * (i + hash(seed + 40 + i))) / nd, jx: (hash(seed + 80 + i) - 0.5) * 3, jy: (hash(seed + 120 + i) - 0.5) * 3,
    lx: D.HOP.cx + 6 - hash(seed + 160 + i) * 60, ly: D.TRAY.y + 3 + hash(seed + 200 + i) * (D.TRAY.d - 6), lz: hash(seed + 240 + i) * 1.2 }));
  // the elements: each ball and bead in the air, each ball resting in the pan (in the pan's own group, in depth order)
  aboveEl.innerHTML = ""; belowEl.innerHTML = ""; panLayer.innerHTML = "";
  const NS = "http://www.w3.org/2000/svg", circle = (cls, r) => { const c = document.createElementNS(NS, "circle"); c.setAttribute("class", cls); c.setAttribute("r", (r * PX_PER).toFixed(2)); return c; };
  post.balls.forEach((b) => { b.fly = circle("sm-ball", BALL_R); aboveEl.appendChild(b.fly); });
  post.beads.forEach((b) => { b.fly = circle("sm-bead", BEAD_R); });
  const order = post.balls.map((b, i) => i).sort((i, j) => depthOf([SPOTS[i][0], SPOTS[i][1], 0], P) - depthOf([SPOTS[j][0], SPOTS[j][1], 0], P));
  order.forEach((i) => { const b = post.balls[i], [sx, sy] = SPOTS[b.spot], c = circle("sm-ball", BALL_R), q2 = iso([D.SCALE.cx + sx, D.SCALE.cy + sy, panTop + BALL_R], P); c.setAttribute("cx", q2[0].toFixed(2)); c.setAttribute("cy", q2[1].toFixed(2)); c.style.display = "none"; b.rest = c; panLayer.appendChild(c); });
  const a = {};
  a.pour0 = LOAD; a.pour1 = LOAD + POUR + SETTLE;
  a.w0 = a.pour1; a.k10 = a.w0 + READ; a.k11 = a.k10 + post.keys[0].length * KEY;
  a.r0 = a.k11 + GAP; a.k20 = a.r0 + READ; a.k21 = a.k20 + post.keys[1].length * KEY;
  a.pr = a.k21 + PAUSE;
  post.at = a;
  post.phase = "run"; post.t = 0; post.sent = false; post.id += 1; post.feed = 0;
  landedBalls = 0; landedBeads = 0; panShown = 0;
  printedEl.textContent = String(post.score).padStart(2, "0");
  showDrums(0);
}
function showDrums(n) { const sc = String(n).padStart(4, "0"); drums.forEach((d, i) => { d.textContent = sc[i]; }); }

// what the machine shows at time t: the digits typed so far, then the running total after each "+"
function machineAt(t) {
  const a = post.at, [p1, p2] = post.parts;
  let shown = 0, key = null, down = 0;
  const typing = (t0, keys, before, entry, after) => {
    if (t < t0) return;
    const i = Math.min(keys.length - 1, Math.floor((t - t0) / KEY)), local = (t - t0) / KEY - i;
    if (t < t0 + keys.length * KEY) { key = keys[i]; down = Math.sin(Math.PI * clamp(local / 0.7)); }
    const typed = keys.slice(0, i + (local > 0.35 ? 1 : 0));
    shown = typed.includes("+") ? after : typed.length ? Number(typed.join("")) : before;
    if (t >= t0 + keys.length * KEY) shown = after;
  };
  typing(a.k10, post.keys[0], 0, p1, p1);
  typing(a.k20, post.keys[1], p1, p2, p1 + p2);
  return { shown, key, down };
}

function step(dt) {
  post.t += dt;
  const t = post.t, a = post.at;
  if (post.phase === "run") {
    post.fade = ease(t / LOAD);
    // the last step: PRINT is pressed and one pulse runs to the printer
    if (!post.sent && t >= a.pr + PRESS * 0.5) {
      post.sent = true;
      const id = post.id;
      wires.send(() => { if (id === post.id) { post.phase = "feed"; post.t = 0; } }, null);
    }
  }
  if (post.phase === "feed") {
    post.feed = ease(post.t / FEED);
    if (post.t > FEED) { post.phase = "hold"; post.t = 0; }
  }
  if (post.phase === "hold" && post.t > 2.6) { post.phase = "clear"; post.t = 0; post.id += 1; }
  if (post.phase === "clear") {
    // torn off along the perforation first, then it fades; the scanners clear with it
    post.fade = 1 - ease((post.t - RIP) / 0.8);
    if (post.t > RIP + 1) { if (touring) { run_ += 1; target = TOUR[run_ % TOUR.length]; } startPost(); }
  }
}

function draw(now) {
  const run = post.phase === "run", t = run ? post.t : 1e9, a = post.at;
  const tt = post.phase === "run" ? post.t : 1e9;
  // the balls and beads where they are; the pan and the tray's level follow what has landed
  let nb = 0, nd = 0;
  post.balls.forEach((b) => {
    const st = ballAt(b, tt);
    if (!st) { b.fly.style.display = "none"; b.rest.style.display = "none"; return; }
    if (st.landed) { nb++; b.fly.style.display = "none"; b.rest.style.display = ""; return; }
    const q2 = iso(st.p, P); b.fly.style.display = ""; b.rest.style.display = "none";
    b.fly.setAttribute("cx", q2[0].toFixed(2)); b.fly.setAttribute("cy", q2[1].toFixed(2));
  });
  post.beads.forEach((b) => {
    const st = beadAt(b, tt);
    if (!st) { b.fly.style.display = "none"; return; }
    if (st.landed) nd++;
    const host = st.below ? belowEl : aboveEl;
    if (b.fly.parentNode !== host) host.appendChild(b.fly);
    const q2 = iso(st.p, P); b.fly.style.display = "";
    b.fly.setAttribute("cx", q2[0].toFixed(2)); b.fly.setAttribute("cy", q2[1].toFixed(2));
  });
  landedBalls = nb; landedBeads = nd;
  const fade = post.phase === "clear" ? (1 - ease(post.t / 0.8)) : 1;
  [aboveEl, belowEl, panLayer].forEach((el) => { el.style.opacity = fade.toFixed(3); });
  const want = post.phase === "clear" ? 0 : landedBalls;
  panShown += (want - panShown) * 0.12;
  panEl.setAttribute("transform", translateAlong(P, [0, 0, panDrop()]));
  pointerEl.setAttribute("transform", "translate(0 " + (11 * panShown / BALLS_MAX).toFixed(2) + ")");
  const lv = 6 * (post.phase === "clear" ? landedBeads * fade : landedBeads) / BEADS_MAX;
  levelEl.setAttribute("y", (7.4 - lv).toFixed(2)); levelEl.setAttribute("height", lv.toFixed(2));
  onOff(scaleLight, run && t >= a.w0 && t < a.k10);
  onOff(trayLight, run && t >= a.r0 && t < a.k20);
  // the keys: each typed number, one key at a time; the drums follow
  if (run) {
    const m = machineAt(t);
    showDrums(m.shown);
    for (const name in keyEls) { const on = name === m.key; keyEls[name].setAttribute("transform", on ? translateAlong(P, [0, 0, -D.KEYPRESS * m.down]) : ""); if (on && m.down > 0.3) keyEls[name].setAttribute("data-down", ""); else keyEls[name].removeAttribute("data-down"); }
  } else for (const name in keyEls) { keyEls[name].setAttribute("transform", ""); keyEls[name].removeAttribute("data-down"); }
  // PRINT goes down and comes back up, once, at the end
  const press = run && t >= a.pr ? Math.sin(Math.PI * clamp((t - a.pr) / PRESS)) : 0;
  keyEl.setAttribute("transform", translateAlong(P, [0, 0, -D.KEYDROP * press]));
  // the printer: ready light while printing; the blue-bar paper scrolls in from the stack as the sheet feeds out of the top
  onOff(ready, post.phase === "feed" || (post.phase === "hold" && Math.floor(now / 400) % 2 === 0));
  const len = D.SHEET_LEN;
  const feed = post.phase === "feed" || post.phase === "hold" ? post.feed : post.phase === "clear" ? 1 : 0;
  feedEl.setAttribute("transform", "translate(0 " + f(-((len * feed) % 8)) + ")");
  let tf = "translate(0 " + f(-len * feed) + ")";
  if (post.phase === "clear") {
    // the tear: a tug up and a twist about the right-hand corner, then away
    const r = ease(post.t / RIP);
    tf = "translate(" + f(-2 * r) + " " + f(-len - 9 * r) + ") rotate(" + f(-7 * r) + " " + D.SHEET_W + " " + len + ")";
  }
  sheetEl.setAttribute("transform", tf);
  sheetEl.style.opacity = post.phase === "clear" ? (1 - ease((post.t - RIP) / 0.7)).toFixed(3) : "1";
}

function wiresAt() {
  const t = post.t, a = post.at, run = post.phase === "run" && !still.matches;
  // each cable carries its reading while the scale or the tray is read, until its number is typed
  onOff(scaleWire, run && t >= a.w0 && t < a.k10);
  onOff(trayWire, run && t >= a.r0 && t < a.k20);
}

function say() {
  const t = post.t, a = post.at, [p1, p2] = post.parts;
  const text = post.phase === "hold" || post.phase === "feed" ? "printed: " + post.score + " out of 100 · " + noteOf(post.score)
    : post.phase === "clear" ? (post.t < RIP ? "tearing it off" : "next post")
    : t < a.w0 ? "pouring the responses…" : t < a.k10 ? "weighing the pan…" : t < a.r0 ? "pan: " + p1
    : t < a.k20 ? "reading the tray…" : t < a.pr ? "pan " + p1 + " + tray " + p2 + " = " + post.score : "PRINT";
  if (readout.textContent !== text) readout.textContent = text;
  const v = "Score " + post.score + " out of 100: " + noteOf(post.score) + ".";
  if (stage.getAttribute("aria-valuetext") !== v) { stage.setAttribute("aria-valuenow", String(post.score)); stage.setAttribute("aria-valuetext", v); }
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (!calm) { step(dt); wires.step(dt); }
  draw(now);
  wiresAt();
  say();
  frame = visible && !calm ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
let quiet = 0, said = 0;
// a new choice is the next post: tear this one off now if it's showing
const steer = (next) => {
  touring = false;
  target = Math.min(1, Math.max(0, next));
  if (still.matches) { settleStill(); }
  else if (post.phase !== "clear") { post.phase = "clear"; post.t = post.feed > 0.5 ? 0 : RIP; post.id += 1; }
  clearTimeout(quiet);
  quiet = setTimeout(() => { if (!still.matches) { touring = true; run_ = Math.max(0, TOUR.findIndex((v) => v >= target - 0.01)); } run(); }, 3600);
  clearTimeout(said);
  said = setTimeout(() => { const sc = scoreOf(target); announce.textContent = "Score " + sc + " out of 100, " + noteOf(sc); }, 700);
  run();
};
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
bench.onTheme(() => run());
let dragging = false;
const fromPointer = (event) => { const b = svg.getBoundingClientRect(); steer(((event.clientX - b.left) / b.width - 0.2) / 0.6); };
stage.addEventListener("pointerdown", (event) => { dragging = true; stage.setPointerCapture(event.pointerId); fromPointer(event); });
stage.addEventListener("pointermove", (event) => { if (dragging) fromPointer(event); });
const release = () => { dragging = false; };
stage.addEventListener("pointerup", release);
stage.addEventListener("pointercancel", release);
stage.addEventListener("keydown", (event) => {
  let to = null;
  const step_ = event.shiftKey ? 0.25 : 0.1;
  if (event.key === "ArrowRight" || event.key === "ArrowUp") to = target + step_;
  if (event.key === "ArrowLeft" || event.key === "ArrowDown") to = target - step_;
  if (event.key === "Home") to = 0;
  if (event.key === "End") to = 1;
  if (to === null) return;
  event.preventDefault();
  steer(to);
});
// reduced motion: everything landed, the total on the drums, the score printed
function settleStill() {
  startPost();
  post.fade = 1; post.phase = "hold"; post.feed = 1; panShown = ballsOf(post.score);
  showDrums(post.score);
  run();
  draw(performance.now()); say();
}
if (still.matches) { target = 0.08; settleStill(); } else startPost();
draw(performance.now());
</script>
