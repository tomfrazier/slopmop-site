# Rebuilds the site every morning so scheduled pages go live on their date. A guide in _content/guides/ with a
# publish_date of today or earlier (UTC) gets its page, its hub links and its sitemap entry; nothing else changes.
# If the build changes anything it's committed to main, GitHub Pages deploys it, and the IndexNow workflow then
# submits the new pages. Run it by hand (Actions → Publish scheduled pages → Run workflow) to publish early.
name: Publish scheduled pages

on:
  schedule:
    - cron: "7 12 * * *"   # 12:07 UTC: early morning in the Americas, lunchtime in Europe
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site
        working-directory: _build
        run: python3 home.py && python3 pages.py && python3 askai.py && python3 content.py
      - name: Commit and push anything that changed
        id: commit
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing scheduled for today."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish scheduled pages for $(date -u +%F)"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Ask GitHub Pages to deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed; the push should still trigger a deploy."
