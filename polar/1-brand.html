<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="ds/styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="ds/_ds_bundle.js"></script>
<style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
#c{width:1920px;height:1080px;position:relative;overflow:hidden;box-sizing:border-box;font-family:var(--font-display)}
.xl{display:inline-flex;align-items:center;padding:0 .32em;height:1.15em;border-radius:6px;background:var(--mop-500);color:var(--text-on-accent);font-weight:700;letter-spacing:-.01em}
</style>

<style>
#c{background:var(--paper-000);display:flex;flex-direction:column}
.bar{height:16px;background:var(--mop-500);flex:none}
.main{flex:1;display:flex;padding:0 120px;align-items:center;gap:80px;position:relative}
.left{flex:1;min-width:0}
h1{margin:0;font:700 168px/1.0 var(--font-display);letter-spacing:-.025em;color:var(--ink-900)}
h1 .xl{font-size:.92em;height:1.08em;vertical-align:.04em;border-radius:10px}
.tag{margin:48px 0 0;font:500 42px/1.35 var(--font-display);color:var(--ink-600);max-width:22ch}
.right{flex:0 0 640px;display:flex;flex-direction:column;gap:22px;transform:rotate(-3deg);transform-origin:50% 50%}
.strip{width:470px;transform:scale(1.36);transform-origin:0 50%;height:60px}
.foot{flex:none;height:96px;background:var(--surface-inverse);display:flex;align-items:center;justify-content:space-between;padding:0 120px}
.meta{font:400 22px/1 var(--font-mono);color:var(--ink-300)}
</style></head><body>
<div id="c">
  <div class="bar"></div>
  <div class="main">
    <div class="left">
      <h1>Get the<br><span class="xl">XL</span> mop.</h1>
      <p class="tag">Less slop.<br>More control.<br>Your call.</p>
    </div>
    <div class="right" id="strips"></div>
  </div>
  <div class="foot"><span id="lock"></span><span class="meta">every feed · the sites you read · your inbox</span></div>
</div>
<script>
var NS=window.SlopMopDesignSystem_ca9143, h=React.createElement;
ReactDOM.createRoot(document.getElementById('lock')).render(h(NS.Wordmark,{size:36,tone:"inverse",showDot:true}));
var tones=["red","red","yellow","red","red"];
ReactDOM.createRoot(document.getElementById('strips')).render(tones.map(function(t,i){
  return h('div',{key:i,className:'strip',style:{marginLeft:(i%2?40:0)+'px'}},h(NS.FoldStrip,{tone:t,density:"minimal",label:"This post was hidden",onRestore:function(){}}));}));
</script></body></html>
